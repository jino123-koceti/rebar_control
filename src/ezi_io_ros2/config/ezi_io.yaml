# =============================================================
# EZI-IO DIO 보드 설정
# FASTECH EZI-IO-EN-L16O16N-T (16 Input / 16 Output)
# =============================================================

# --- 상부체 보드 (192.168.0.6, board_id=0) ---
# 상부 결속부 XYZ+Yaw 스테이지 리미트 센서
ezi_io:
  ros__parameters:
    ip_address: "192.168.0.6"
    port: 502
    slave_id: 1
    update_rate: 20.0
    input_start_address: 0
    input_count: 16

    # 상부체 스테이지 리미트 센서 매핑 (실제 배선 기준)
    # Y축: 원점(IN01), 최대(IN00)
    limit_y_min_channel: 1  # IN01: Y축 원점 리미트
    limit_y_max_channel: 0  # IN00: Y축 최대 리미트

    # X축: 원점(IN02), 최대(IN03)
    limit_x_min_channel: 2  # IN02: X축 원점 리미트
    limit_x_max_channel: 3  # IN03: X축 최대 리미트

    # Yaw축: 원점(IN04)
    limit_yaw_min_channel: 4  # IN04: Yaw축 원점 리미트

    # Z축: 원점(IN05), 최대(IN06)
    limit_z_min_channel: 5  # IN05: Z축 원점 리미트
    limit_z_max_channel: 6  # IN06: Z축 최대 리미트

    # IN07~IN15: 미사용

# --- 하부 주행부 보드 (192.168.0.5, board_id=1) ---
# 범퍼 센서 + 바닥 근접 센서 (철근 카운팅용)
ezi_io_lower:
  ros__parameters:
    ip_address: "192.168.0.5"
    port: 502
    slave_id: 1
    update_rate: 20.0
    input_start_address: 0
    input_count: 16

    # 바닥 근접 센서 (하방, 철근 카운팅용)
    proximity_front_channel: 4   # IN04: 전방 근접센서 (바닥 비춤)
    proximity_rear_channel: 3    # IN03: 후방 근접센서 (바닥 비춤)

    # 범퍼 센서 (충돌 감지)
    bumper_front_channel: 8      # IN08: 전방 범퍼
    bumper_rear_channel: 10      # IN10: 후방 범퍼
    bumper_left_channel: 11      # IN11: 좌측 범퍼
    bumper_right_channel: 9      # IN09: 우측 범퍼

    # IN00~IN02, IN05~IN07, IN12~IN15: 미사용
