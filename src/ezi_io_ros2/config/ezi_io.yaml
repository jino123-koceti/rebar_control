# =============================================================
# EZI-IO DIO 보드 설정
# FASTECH EZI-IO-EN-L16O16N-T (16 Input / 16 Output)
# =============================================================

# --- 상부체 보드 (192.168.0.6, board_id=0) ---
# 상부 결속부 XYZ+Yaw 스테이지 리미트 센서
#
# ★ 2026-09-29 실측 확정 — 센서를 순서대로 하나씩 만져 확인했다.
#   보드는 Ethernet-I8O8 (입력 8 / 출력 8). 문서의 L16O16(16/16)은 틀렸다.
#   **7개 전부 a접점**: 평상시 OFF, 트리거되면 ON. (하부 범퍼는 극성이 섞여 있으니 주의)
#   IN07 은 미사용.
#   기존 설정값은 채널이 전부 달랐다 (IN00=Y최대, IN01=Y원점, IN02=X원점 …).
#
#   yaw 센서는 하나다 (2차년도도 동일).
#   ⚠ 2차년도는 **발행 이름과 구독 이름이 어긋나 있었다** — ezi_io_node 는
#     /limit_sensors/yaw_min 으로 발행했는데 homing_controller·joint_controller·can_sender 는
#     /limit_sensors/yaw_home 을 구독한다. 그래서 yaw 리미트가 실제로 안 붙어 있었을 수 있다.
#     3차년도는 **yaw_home 하나로 통일**한다 (호밍 쪽 구독 이름).
ezi_io:
  ros__parameters:
    ip_address: "192.168.0.6"
    # ⚠ 502(Modbus)는 이 보드가 거부한다. 라이브러리 Plus-E UDP(FAS_Connect)로 붙는다.
    port: 502
    slave_id: 1
    update_rate: 20.0
    input_start_address: 0
    input_count: 8

    # X축: 원점(IN00), 최대(IN01)
    limit_x_min_channel: 0
    limit_x_max_channel: 1

    # Y축: 원점(IN04), 최대(IN06)
    limit_y_min_channel: 4
    limit_y_max_channel: 6

    # Z축: 원점(IN02), 최대(IN03)
    limit_z_min_channel: 2
    limit_z_max_channel: 3

    # Yaw: 센서 1개 (IN05) → /limit_sensors/yaw_home 으로 발행한다
    limit_yaw_home_channel: 5

    # 전 채널 a접점 (트리거 = ON)
    limits_normally_closed: false

    # IN07: 미사용

# --- 하부 주행부 보드 (192.168.0.5, board_id=1) ---
# 범퍼 센서 + 바닥 근접 센서 (철근 카운팅용)
ezi_io_lower:
  ros__parameters:
    ip_address: "192.168.0.5"
    port: 502
    slave_id: 1
    update_rate: 20.0
    input_start_address: 0
    input_count: 16

    # 바닥 근접 센서 (하방, 철근 카운팅용)
    proximity_front_channel: 4   # IN04: 전방 근접센서 (바닥 비춤)
    proximity_rear_channel: 3    # IN03: 후방 근접센서 (바닥 비춤)

    # 범퍼 센서 (충돌 감지) — 2026-09-22 실측 (하나씩 눌러 확인)
    # 주의: 접점 극성이 섞여 있다. 전방/후방은 NO(눌리면 ON),
    #       좌측/우측은 NC(평상시 ON, 눌리면 OFF). 채널만 보고 ON=충돌로 판정하면 안 된다.
    # 이전 값(8/10/11/9)은 실배선과 전부 달랐다.
    bumper_front_channel: 7      # IN07: 전방 범퍼  NO (눌림 = ON)
    bumper_rear_channel: 5       # IN05: 후방 범퍼  NO (눌림 = ON)
    bumper_left_channel: 13      # IN13: 좌측 범퍼  NC (눌림 = OFF)
    bumper_right_channel: 10     # IN10: 우측 범퍼  NC (눌림 = OFF)
    bumper_front_normally_closed: false
    bumper_rear_normally_closed: false
    bumper_left_normally_closed: true
    bumper_right_normally_closed: true

    # 조작 스위치 — 2026-09-22 실측. 평상시 둘 다 OFF 였으므로 NO(눌림 = ON)로 판단
    start_switch_rear_channel: 0   # IN00: 후방 START 스위치
    stop_switch_channel: 1         # IN01: STOP 스위치
    # 주의: STOP 이 NO 면 선이 끊겨도 "안 눌림"으로 보인다 (보통 비상정지는 NC 로 배선)

    # IN02: 평상시 ON — 용도 미확인
    # 근접센서 IN03/IN04 는 미검증 (위 값은 이전 설정 그대로)
    # 그 외 채널: 미사용
