# 축 정의 단일 소스 (3차년도)
#
# 모터 ID·부호·감속비·리미트·브레이크를 **여기 한 곳에만** 둔다.
# 코드에 0x14X 리터럴을 쓰면 tools/check/check_axis_literals.py 가 실패시킨다.
#
# 왜 이 파일이 필요한가: 2차년도는 0x14X 가 10개 파일에 흩어져 있었고, 3차년도에서
# 축이 한 칸씩 밀리면서 주석과 실제가 어긋났다. `position_control_node` 주석의
# 0x145=Yaw 를 믿고 엉뚱한 축을 의심한 일이 실제로 있었다.
#
# 표기: [확정] = 3차년도 실측 확인 / [잠정] = 근거 있으나 미검증 / [미확인]
#
# 2차년도 → 3차년도 ID 대응 (틀리기 쉬우니 남겨 둔다):
#   횡이동 0x143(1축) → 0x143+0x144(2축) / X 0x144→0x145 / Y 0x145→0x146
#   Z 0x146→0x147 / Yaw 0x147→0x148

meta:
  can_interface: can2          # [확정] 모터 버스 1 Mbps. 리모콘은 can3 250 kbps
  remote_interface: can3       # [확정] 별도 PCAN. 이름 고정은 pcan-fix-names.service
  protocol: RMD-X4             # 0xA2 속도 / 0xA4 위치 / 0xA9 힘제어위치 / 0x9A 상태

# 주행부 — 하부체
drive:
  # [확정 2026-09-08] ID1=우측, ID2=좌측. 2차년도 코드 이름이 뒤바뀌어 있었다.
  right:
    can_id: 0x141
    model: RMD-X4-36           # [확정] 2차년도 말에 양쪽 다 X4-36 으로 교체됨
    gear: 36
  left:
    can_id: 0x142
    model: RMD-X4-36
    gear: 36
  # [확정 2026-09-08 실측] 바퀴 1회전 = 183 mm → r = 29.12 mm
  wheel_radius_m: 0.02912
  wheel_base_m: 0.5
  # [확정] 정격 498 dps(83 rpm) = 0.249 m/s. 이 위로 올리면 포화한다
  max_linear_mps: 0.25
  # [확정 2026-09-08] 선회 시 25~28Hz 기구 공진. 절반으로 낮추면 진동 33~61% 감소
  max_angular_radps: 0.5
  wheel_max_dps: 498.0
  # [확정 2026-09-14] 0x43 가감속은 **모터축 기준**이다. 출력축 = 설정값 ÷ 감속비.
  # ⚠ X4-36 은 0x43 이 ROM 에 남지 않아 **매 기동 재적용이 필수**다.
  #   안 하면 0→최고속 14.9초. index 2=가속, index 3=감속 으로 따로 쓴다.
  rom_accel: 1200
  rom_decel: 1200
  rom_accel_reapply_each_boot: true
  # [잠정] 전류 임계. 3차년도 실측 없음 — 2차년도 프로젝트 기준값을 가져왔다
  current:
    rated_a: 7.8
    warning_a: 9.0
    danger_a: 12.0
    emergency_a: 15.0
  # [확정 2026-08-06] 모터측 통신두절 보호(0xB3). 젯슨 프리즈 시 SW 워치독은 같이 멈춘다.
  # ⚠ 주행모터에만. 스테이지·Yaw 에는 절대 걸지 말 것 (유휴 시 명령이 끊겨 오작동)
  motor_watchdog_ms: 500
  # [잠정] 직진 드리프트 잔여 보정. 3차년도 재교정 필요
  left_speed_scale: 1.0
  right_speed_scale: 1.0

# 횡이동 — 2축을 반대로 돌린다 (2차년도는 1축이었다)
lateral:
  axis_1:
    can_id: 0x143
    joint: joint_1
    sign: +1                   # [확정] + 가 좌측
  axis_2:
    can_id: 0x144
    joint: joint_2
    sign: -1
  model: RMD-X4-36
  gear: 36
  # [확정] 1회전 = 50 mm. 홈 기준은 0x61 (이 모터는 0x90 미지원)
  mm_per_turn: 50.0
  home_command: 0x61
  home_file: tools/motor/lateral_home.json
  # [확정] 결속 상태 12.13A 로 12/12 완주. 여유 1.7배
  current:
    rated_a: 6.1
    warning_a: 8.0
    danger_a: 12.0
    emergency_a: 18.0
  # [확정 2026-08-14] 0xA4(위치)에는 maxTorque 바이트가 없다 → 0xA9(힘제어위치)로 제한을 건다
  torque_limit_pct: 100
  position_command: 0xA9

# 상부 스테이지
stage:
  x:
    can_id: 0x145
    joint: joint_3
    limit_min: x_min           # [확정] ezi_io 상부 IN00
    limit_max: x_max           # [확정] IN01
    # [확정] 2026-09-30 실측: **양수 속도가 x_min(원점) 방향**이다.
    #   homing_node 기본값이 -1 이었으므로 반대였다 — 그대로 돌렸으면 x_max 로 달렸다.
    home_dir: +1
    # [확정] 2026-09-30 실측: x_min 에서 모터축 507.54° 빼내고 자로 147.5mm 측정.
    #   147.5 / 507.54 = 0.290617 mm/도(모터축).  1mm = 모터축 3.44° = 2506 counts.
    #   검산: 전체 스트로크 모터축 1561° x 0.290617 = 453.7 mm
    mm_per_deg: 0.290617
    stroke_mm: 453.7          # [확정] x_min~x_max, 모터 4.34 바퀴
    brake: true                # [확정] 재시작마다 잠긴다. 해제는 0x77 (휘발성)
    # ⚠ [확정] 이 개체는 온도 필드가 0xEC(236°C) 고정 — 과열 보호를 믿을 수 없다
    temp_sensor_faulty: true
  y:
    can_id: 0x146
    joint: joint_4
    limit_min: y_min           # [확정] IN04
    limit_max: y_max           # [확정] IN06
    # [확정] 2026-09-30 실측: 양수 = y_min(원점), 음수 = y_max. 양끝 모두 확인했다
    home_dir: +1
    # [확정] 2026-09-30 실측: y_min 에서 모터축 309.82° 빼내고 자로 69mm 측정.
    #   69 / 309.82 = 0.222711 mm/도(모터축).  X(0.290617)보다 리드가 짧다.
    # ⚠ y_min 도달 위치가 반복마다 모터축 8.77°(= 1.95mm) 흔들린다.
    #   접근 속도(fine 15dps)와 감지 지연 탓이다. 캘리브레이션 정확도에 직접 영향.
    mm_per_deg: 0.222711
    # [확정] 2026-09-30 실측 전 행정: y_min 0x61=80336 → y_max 0x61=-1061122
    #   1141458 counts = 모터 4.354 바퀴 = 모터축 1567.6° → 349.1 mm
    #   ⚠ X 와 모터 회전수는 거의 같은데(4.34 vs 4.35) 거리가 다르다 —
    #     같은 기구에 리드스크류 피치만 다른 것으로 보인다.
    stroke_mm: 349.1
    brake: true
  z:
    can_id: 0x147
    joint: joint_5
    limit_min: z_min           # [확정] IN02
    limit_max: z_max           # [확정] IN03
    brake: true
    # ⚠ [확정] **Z 를 z_min(위) 으로 먼저 보낸 뒤에 X 를 움직여야 한다.**
    #   Z 가 z_max 쪽(아래)에 있으면 X 이동 중 철근 배근에 걸린다.
    #   → 호밍에서 Z 와 X 를 **동시에 움직이면 안 된다.** 순서는 z → x 고정.
    # ⚠⚠ [확정] 2026-09-30 실측: **브레이크를 풀면 즉시 떨어진다.**
    #   명령 없이 0x77 만 보냈더니 -159.25° (출력축 -12.74°) 자유낙하했다.
    #   모터는 명령이 흐르는 동안에만 붙잡는다. 따라서:
    #     · 브레이크 해제와 속도 명령은 **반드시 붙어 있어야** 한다
    #     · 호밍 종료·중단·비상정지 때 **즉시 0x78 로 잠글 것**
    #     · 지금 safety 의 전체정지는 속도만 0 으로 만든다 → Z 는 그대로 떨어진다 (미수정)
    gravity_load: true
    # [확정] **이름과 물리 방향이 반대다.** z_min 센서는 **위쪽**에 있다.
    #   리프팅축이라 집어넣은(올린) 쪽이 min, 뻗은(내린) 쪽이 max 인 셈이다.
    #   근거: 브레이크 해제 낙하 = 엔코더 감소(아래). S14(-50dps) = 엔코더 증가 = 상승,
    #        계속 올리니 z_min 점등. 즉 **엔코더 증가 = 상승 = z_min 방향**.
    #   호밍이 z_min 으로 가는 것은 **올리는** 동작이라 중력 반대라서 안전하다.
    home_dir: -1               # [확정] 음수 명령 → 엔코더 증가 → 상승 → z_min
    # [확정] 2026-09-30 실측: z_min(위)에서 모터축 209.70° 하강, 자로 19mm 측정.
    #   19 / 209.70 = 0.090606 mm/도(모터축). 세 축 중 가장 촘촘하다 —
    #   리프팅축이라 감속을 더 한 것으로 보인다 (X 0.2906, Y 0.2227).
    mm_per_deg: 0.090606
    # [확정] 2026-09-30 실측 전 행정: z_min(위) 0x61=-199601 → z_max(아래) 0x61=918952
    #   1118553 counts = 모터 4.267 바퀴 = 모터축 1536.1° → 139.2 mm
    # 세 축 모두 모터 회전수가 4.27~4.35 로 거의 같다 — 같은 기구에 리드스크류 피치만
    #   다르다. Z 가 가장 촘촘한 것은 리프팅축이라 감속을 더 했기 때문이다.
    #   X 453.7mm / Y 349.1mm / Z 139.2mm
    stroke_mm: 139.2
  yaw:
    can_id: 0x148
    joint: joint_6
    limit_home: yaw_home       # [확정] IN05. 센서 1개뿐 (2차년도도 동일)
    # [확정] 2026-09-30: **결속건이 12시 방향일 때** yaw_home 이 켜진다. 원점의 물리적
    #   의미가 이것이다.
    # ⚠ [확정] 기계적 간섭: **yaw 가 홈에 있어야 Y 가 y_min/y_max 까지 간다.**
    #   그래서 호밍 순서에서 yaw 가 y 보다 **먼저** 와야 한다 (기본 순서 z→x→y→yaw 는
    #   이 조건을 어긴다). x 도 막히는지는 미확인.
    # ~~[확정] 기계식 브레이크가 없다~~ → **2026-10-03 철회.** X/Y/Z/yaw 는 전부 같은
    #   RMD-X4-10 이고, 거동도 같다. 0x77 을 보낸 뒤 0x9A DATA[3] 이 X·Y·Z·횡이동과
    #   똑같이 **0x01(해제)** 로 읽혔다. 9/30 에 "yaw 만 0x00" 으로 본 것은 **0x77 이
    #   아직 안 먹은 상태를 읽은 타이밍 착오**였다 (같은 날 재시도에서 0x01 나옴).
    #   ⚠ yaw 를 특별 취급하지 말 것. 다르게 보이면 타이밍부터 의심한다.
    # ⚠ 호밍·구동 전에 0x77 은 반드시 보내고, **먹었는지 DATA[3] 로 확인한 뒤** 움직일 것.
    #   해제가 명령보다 먼저 도착해야 한다 — 0.4초로는 부족한 경우가 있었다.
    # [확정] 자중 흐름 없음: 0x77 해제 후 5초에 -102 counts (건 0.011°, 노이즈 수준)
    brake: true
    # ⚠ [확정 2026-10-03] **토크 상한을 올려야 2·3번 자세 사이를 지난다.**
    #   0xA2 DATA[1] = maxTorque 는 **정격 전류의 백분율**(1 LSB = 1%)이다.
    #   기본 100(=정격 100%)으로는 그 구간에서 7.6~7.8A 에 막혀 건 0.1° 밖에 못 간다.
    #   255 로 풀면(스톨 초과 → 힘 제어 비활성) 7.33A 에 돌파하고 이동 중 5.67A 다.
    #   ⚠ 그래도 **255 로 두지 않는다**: position_control_node 의 Protection 은 주행
    #     모터에만 걸려 있어 **상부축에는 전류 보호가 없다.** 지금 이 값이 유일한
    #     상한이므로 풀어버리면 잼이 났을 때 모터 스톨 전류까지 막을 것이 없다
    #     (2026-09-30 에 그 틈에서 10.7A/86°C 까지 갔다).
    #   150 은 50% 여유를 주면서 상한을 남긴다 (정격 7.8A × 150% = 11.7A).
    #   ⚠ [2026-10-03 후속] **기구 볼트를 느슨하게 하자 부하가 크게 줄었다** —
    #     같은 구간 같은 방향에서 최대 9A → **5.15A**, 1번↔4번 전 구간이 1.5~5.4A 로
    #     지나간다. 무거움의 원인은 토크 부족이 아니라 기어 맞물림이었다.
    #     남은 빡빡한 지점은 4번 자세 직전(건 +17.7° 부근, 11.03A)뿐이다.
    max_torque: 150
    # [미확인] 2차년도 0x90 기준상수(home=17994, max=47594, 73.88 counts/deg)는
    #   그 모터 개체 값이다. 3차년도 0x148 로 재측정해야 한다
    # [확정] 2026-09-30 후반 재측정 — **리미트 감지판 위치를 바꾸고 재조립한 뒤** 값이다.
    #   그 전 값(감지 구간 275104~291016, 12시 284641)은 무효다.
    encoder:
      cpr: 262144              # 모터 1회전 counts (18bit). 엔코더 자체라 재조립과 무관
      # [확정] 2026-09-30: **멀티턴은 전원을 내리면 날아간다. 단회전만 복원된다.**
      #   X 축으로 결정적 확인: x_min 에서 631200(2.41바퀴) → 전원 끄고 x_max 갔다가
      #   x_min 복귀 → 102639. 멀티턴이면 631200, 단회전이면 106912 인데 후자였다.
      #   ⚠ 1바퀴 안에서 재면 두 가설이 같은 값을 내서 아무것도 증명 못 한다.
      #     yaw 2번 자세·Y 로 잰 앞선 시험이 그래서 무효였다.
      #   → **호밍이 매번 필요하다.** X 는 전 구간 4.34바퀴, yaw 는 1.23바퀴다.
      #   0x62(영점 오프셋)만 전원과 무관하게 유지된다.
      multiturn_absolute: false
      # ⚠⚠ **절대 counts 는 전원 세션 안에서만 유효하다.** 멀티턴이 전원에 날아가므로
      #   전원을 껐다 켜면 영점이 다시 잡혀 아래 숫자들이 전부 달라진다.
      #   **영구적으로 유효한 것은 "차이(오프셋)" 뿐이다.** 호밍은 에지를 찾고
      #   오프셋만큼 더 가는 방식이라, 감지판이 어디 있든 오프셋만 맞으면 된다.
      #
      # 감지 구간 폭 18857 counts = 건 2.07° (접근 방향에 따라 에지가 다르다)
      #   [2026-09-30 세션값, 참고용] from_low 205327 / from_high 224184
      #
      # ── 영구 유효: 에지 기준 오프셋 ────────────────────────────────────────
      # **전제: 사용자가 호밍 전에 yaw 를 12시 ±3° 안에 놓아둔다.**
      #   12시(266199)는 감지 구간(205327~224184)보다 **위**이고, ±3°(±27307counts)
      #   를 써도 238892~293506 이라 **전부 구간보다 위**다. 따라서 탐색 방향은
      #   항상 **counts 감소**(3번→2번 방향)로 확정되고, 만나는 것은 **상단 에지**다.
      #   전제가 깨지면(예: 4번 자세에서 시작) 방향이 틀려 기계 끝으로 민다 →
      #   그래서 호밍 전에 단회전값으로 전제를 **검사**해야 한다 (아래 noon_single).
      seek_dir: -1             # counts 감소 = 3번→2번 방향 (양수 명령이 counts 증가)
      # ⚠⚠ **오프셋은 접근 방향마다 다르다.** 감지판에 폭이 있어서 켜지는 지점이
      #   다르기 때문이다 — 건 각도 **증가** 방향으로 접근하면 판의 아래 경계에서,
      #   **감소** 방향이면 위 경계에서 켜진다. 2026-10-03 실장비 실행에서 1번 자세
      #   (증가 방향)로 접근했는데 위 경계 기준 한 값만 써서 그만큼 비껴갔다.
      #   → 아래 edge_single_from_low / _from_high 에서 **코드가 유도한다.**
      #     offset(모터축) = wrap(noon_single − edge_single) / 728.18
      # ~~home_offset_deg: 57.70~~ (2026-09-30 값, 폐기)
      #   그때 상단 에지 224184 로 계산한 +57.70° 인데, 2026-10-03 재측정에서 위 경계가
      #   218011 로 6173 counts(모터축 8.5°) 내려왔다. 감지판이 움직였거나 측정 방식이
      #   달랐다. 손으로 계산한 상수를 두면 또 어긋나므로 **유도하게 바꿨다.**
      # 전제 검사용 — 12시의 **단회전값**. 전원과 무관하게 유효하고 구동범위 안에서 유일.
      noon_single: 4055
      # ── 에지 단회전값 ─────────────────────────────────────────────────────
      # ⚠⚠ **이 값은 센서의 물리 위치가 아니라 `FINE` 단계가 실제로 원점을 적는
      #   지점이다.** 오프셋이 거기서 적용되므로, 파이프라인 전체(센서 발행 주기 ·
      #   위치 토픽 지연 · FINE 속도 · BACK_OFF 히스테리시스)를 포함한 캘리브레이션이다.
      #   별도 도구로 "정확한 센서 경계" 를 재서 넣으면 안 맞는다 — 2026-10-03 에
      #   `yaw_edge_both.py`(12dps, CAN 직독) 로 213898 을 재서 넣었더니 호밍이
      #   1번 자세를 건 1.27° 비껴갔다. 호밍 로그가 적는 지점은 204660 이었고,
      #   그 차이(건 0.87°)가 그대로 오차였다.
      # **재는 법: 호밍을 돌려 `원점 확정 (… 단 NNNNNN)` 로그값을 쓴다.**
      #   그 전에 `/motor_*/encoder_single` 이 10Hz 인지 확인할 것 — 1Hz 로 묵은 값을
      #   보고 역산하면 30dps 에서 건 2.4° 어긋나 엉뚱한 결론이 난다.
      # 기구 무결성 검사도 겸한다: 커플링이 미끄러지거나 감지판이 움직이면 달라진다.
      edge_single_from_low:  204660   # [호밍 실측 2026-10-03] 증가 접근 → +84.51°
      edge_single_from_high: 222078   # [호밍 실측 2026-10-03] 감소 접근 → +60.59°
      #   3번 자세 출발 호밍의 `원점 확정` 로그값. 도구 측정값(218011)보다 4067 counts
      #   (건 0.45°) 위였고, 그 차이가 그대로 오차였다 (+0.41° → 보정 후 ~0°).
      #   실행 간 재현성은 건 0.14° 정도 (2번 출발 220780 / 3번 출발 222078).
      # ⚠ [확정 2026-10-03] **1번 자세로 갈수록 전류가 오른다.** 위치제어 20° 단계로
      #   건 10° 이동하는 동안 2.0 → 2.4 → 2.2 → 3.0 → 3.8 → **5.3A**. 1번 자세가
      #   기계적 간섭 지점에 가깝다는 뜻이다 (지난 사고: 1번을 지나 끝단 10.7A/86°C).
      #   1번 근처에서는 전류를 보며 접근하고, 넘기지 말 것.
      pose_offset_from_noon_gun_deg:   # 12시 기준 자세 (건 각도)
        1: -16.74   # [실측 2026-10-03] 단회전 113816 (16샘플 편차 0)
        2:  -5.46   # [추정] 재측정 필요
        3:  +4.00   # [실측 2026-10-03, 재조정 후] 단회전 40479 (123샘플 편차 0)
        4: +16.69   # [실측 2026-10-03, 재조정 후] 단회전 155951 (104샘플 편차 0)
                    #   ⚠ 옛값 +18.80° 은 **간섭 구간에 들어갔다** — 1번에서 올라오며
                    #   건 +17.7° 까지는 1.5~5.4A 로 가볍게 가는데 거기서 11.03A 로
                    #   튀었다. 그래서 간섭 시작점 아래로 재조정했다.
      # Y 는 yaw 가 12시일 때만 y_min/y_max 에 닿는다. 여유 **건 ±3°** (사용자 확인).
      # ⚠ 이 값은 **호밍 시작 조건이 아니다.** 아래 pose_id_* 가 그 역할을 대신한다.
      #   (예전에는 "사용자가 12시 ±3° 에 놓는다" 를 전제로 검사했는데, 운용 현실은
      #    전원이 꺼질 때 yaw 가 1~4번 자세 중 하나에 있다는 것이라 전제가 안 맞았다.)
      home_tolerance_gun_deg: 3.0
      # ── 자세 판별 (2026-10-03) ─────────────────────────────────────────────
      # 단회전값으로 **어느 자세인지**를 알아낸다. 멀티턴은 전원에 날아가지만
      # 단회전은 복원되고, 1~4번과 12시의 단회전값이 **최소 건 4.54° 떨어져 있어**
      # 유일하게 갈린다 (최소 간격은 4번↔2번). 그래서 호밍 전에 사용자가 yaw 를
      # 손으로 12시에 맞출 필요가 없다.
      #   12시=4055  3번=66041  1번=115830  4번=175177  2번=216501
      # ⚠ 임의 각도는 알 수 없다. 자세 사이에 있으면 28.8°(모터 1회전) 떨어진 두
      #   후보가 생겨 모호해진다 → 그때는 **거부**한다 (모르고 탐색하는 것보다 안전).
      # 최소 간격의 **절반보다 작아야** 판정 구간이 겹치지 않는다.
      # 2026-10-03 3번 자세 재조정으로 최소 간격이 4.63° → **4.00°**(12시↔3번)가
      # 되어 2.0 은 여유가 0 이 됐다 → 1.5 로 조인다. 실측 자세 오차가 0.00~0.33°
      # 이므로 1.5° 는 넉넉하다.
      # (12시와 3번을 혼동해도 호밍 자체는 같다 — 탐색 방향이 둘 다 -1 이고 오프셋도
      #  방향만 보며 준비자세는 설정값을 쓴다. 그래도 자세를 아는 것은 흔들린다.)
      pose_id_tolerance_gun_deg: 1.5
      # 탐색 거리 상한. 에지는 자세 범위 **안쪽**(12시 -4.62°)에 있어서 자세에 따라
      # 탐색 방향이 ± 두 가지다. 어느 자세에서든 에지까지 최대 건 23.42°(4번) 이므로,
      # 이 값을 넘겼는데 리미트가 안 켜지면 **방향이 틀렸거나 기구 이상**이다.
      # 그때는 방향을 뒤집지 말고 멈춘다 — 역방향 재탐색은 이미 끝단에 박은 뒤의
      # 동작이다 (2026-09-30 에 그렇게 10.7A/86°C 까지 갔다).
      search_limit_gun_deg: 26.0
      # ⚠ 2·3·4번은 아직 **추정**이다 (재조립 전 측정에 보정을 얹은 값).
      #   재는 법: 출력을 끊고(0x78→0x80) 손으로 그 자세에 맞춘 뒤 0x61 을 읽는다.
      #   1번은 그렇게 쟀고 기록값과 건 0.22° 차이였다 — 표 자체는 대체로 맞다.
    # ⚠ yaw 는 끝 리미트가 없다. 스톨 감지(명령 중 엔코더 무변화)가 유일한 보호다.
    # ⚠ 리모콘에 yaw 가 배정되어 있지 않다 (/joint_6/speed 발행자 0개).
  # ── 자세별 가동 범위 (2026-10-03 실측, mm · 호밍 원점 기준) ───────────────
  # ⚠ **yaw 자세에 따라 X·Y 가동 범위가 다르다.** 결속건이 회전하면서 간섭 방향이
  #   바뀌기 때문이다. 이 표가 없으면 검출 지점으로 보낼 때 프레임을 친다.
  #   리모콘으로 한계까지 몰아 CAN 으로 읽은 값이다 (X 는 전류 필드가 고장이라
  #   사람 판단, Y 는 전류로 교차 확인).
  #
  #   X 상한은 **12시가 최소다** — 12시 361.0 < 3번 383.2 < 2번 391.4 <
  #   4번 415.6 < 1번 418.7mm. 건이 정면으로 뻗을 때 X 방향을 가장 많이 막는다.
  #   ⚠⚠ [2026-10-03] 12시를 안 재고 3번(383.2)을 최악으로 쓰던 때가 있었는데,
  #     실측 12시가 361.0mm 로 **22mm 더 짧았다.** 자세 전환 6건 중 4건이 12시를
  #     지나고 호밍도 12시로 가므로, 그 22mm 가 그대로 충돌 여유였다.
  #     → **자세 사이 구간을 안 재고 양 끝 자세로 보간하면 안 된다.**
  #   Y 는 비대칭이다 — 상한이 1번 285 → 4번 320mm 로 커진다.
  #   ⚠ Y 하한은 1~3번이 40.9~43.3mm 로 비슷해 "자세와 무관" 으로 보였으나
  #     4번이 54.2mm 라 **자세 의존이 맞다.** 1~3번의 근접은 우연이었다.
  #   12시에서는 Y 가 **전 행정** 열린다 (0 ~ 349.1mm). `yaw` 항의 "yaw 가 홈에
  #     있어야 Y 가 y_min/y_max 까지 간다" 가 이것이고, 실측으로 확인했다
  #     (ymin 쪽 -1.64mm 까지 도달 — 원점 반복오차 ±1.95mm 안).
  envelope:
    margin_mm: 10.0     # 측정값에서 이만큼 안쪽까지만 허용한다
    # 키 0 = 12시. 결속 자세는 아니지만 **전환 때 지나가고 호밍 목표**라서 잰다.
    poses:
      0: {x: [0.0, 361.0], y: [0.0, 349.1]}
      1: {x: [0.0, 418.7], y: [40.9, 285.1]}
      2: {x: [0.0, 391.4], y: [42.1, 294.6]}
      3: {x: [0.0, 383.2], y: [43.3, 319.5]}
      4: {x: [0.0, 415.6], y: [54.2, 320.1]}
    # ── 자세 **사이** 표본 (회전이 지나가는 각도) ─────────────────────────
    # ⚠⚠ **가동범위는 자세 사이에서 단조롭지 않다.** 양 끝 자세만 재서 그 사이를
    #   추정하면 틀린다. 두 번 확인됐다:
    #     · 12시 (2번↔3번 사이): X 상한 361.0mm — 3번(383.2)보다 22mm 짧다
    #     · 건 +10.8° (3번↔4번 사이): Y 86.0~286.4mm — 양 끝 교집합(54.2~319.5)
    #       보다 **65mm 좁다**. 하한 32mm · 상한 33mm 양쪽 다 최악이다.
    #     · 건 -11.7° (1번↔2번 사이): Y 66.2~259.9mm — 양 끝 교집합(42.1~285.1)
    #       보다 **49mm 좁다**. 하한 24mm · 상한 25mm.
    #   3번 다 **양 끝보다 나쁘다.** 건이 자세에 맞춰져 있을 때 간섭이 가장 적고,
    #   사이로 틀어지면 모서리가 더 튀어나오는 것으로 보인다. 따라서 **아직 안 잰
    #   사이 구간도 양 끝보다 나쁠 것으로 가정해야 한다** (2↔3 사이는 12시만 쟀고,
    #   3↔4·1↔2 는 한 점씩, 나머지는 미측정).
    #   → 3번→4번 회전을 Y 70mm 에서 시키면 양 끝 기준으로는 통과하는데 부딪힌다.
    #
    # 결속에 쓰는 자세가 아니라 `poses` 에 넣지 않는다 — 자세 선택·자세별 강제에는
    # 쓰이지 않고, **회전 안전창(`transit_window`)과 교집합(`any`)에만** 들어간다.
    # 축은 **잰 것만** 적는다 (안 잰 축은 그 표본이 제약하지 않는다).
    samples:
      - gun: 10.80          # 3번↔4번 사이 54% 지점 (단회전 102392, 0x60 으로 교차확인)
        y: [86.0, 286.4]    # [실측 2026-10-03] 리모콘으로 양끝까지 몰아 CAN 으로 읽음
        note: 3↔4 전환 중 지나가는 각도. X 는 미측정
      - gun: -11.71         # 1번↔2번 사이 45% 지점 (멀티턴 기준점으로 세움)
        y: [66.2, 259.9]    # [실측 2026-10-03] 1번 40.9~285.1 · 2번 42.1~294.6 보다 좁다
        note: 1↔2 전환 중 지나가는 각도. X 는 미측정
      # ── 아래 둘은 [추정] 이다. 측정하지 않았다 ────────────────────────
      # 근거 (사용자 판단 2026-10-03, 기구를 직접 보고 낸 것):
      #   · 2번↔12시 구간: Y 제약이 **1번↔2번 사이보다 덜** 심하다
      #   · 12시↔3번 구간: Y 제약이 **3번↔4번 사이보다 덜** 심하다
      #   · 두 구간 모두 X 제약이 **12시보다 덜** 심하다
      # 그래서 각 구간에 "그보다 나쁠 수 없다" 는 실측값을 경계로 깐다.
      #
      # X 는 따로 안 적는다 — 2↔3 전환창에 12시(pose 0, X 361.0)가 이미 들어가
      #   자동으로 조여지므로 위 X 근거가 코드에서 이미 성립한다.
      # Y 는 **반드시 적어야 한다.** 안 적으면 2↔3 전환창이 2·3번 자세만으로
      #   계산돼 53.3~284.6 이 되는데, 이는 근거로 든 실측값들보다 **느슨하다** —
      #   근거가 코드를 보호해 주지 못한다. 적어야 비로소 성립한다.
      # ⚠ 두 구간의 각도 간격(5.46° / 4.00°)은 근거로 쓴 구간(11.28° / 12.69°)
      #   보다 좁다. 사이 구간 손실은 간격이 넓을수록 커지는 것으로 보이므로
      #   이 경계는 **보수적**이다 — 실제로 재면 넓힐 수 있다.
      - gun: -2.73          # 2번(-5.46°) 과 12시 중간
        y: [66.2, 259.9]    # [추정] 1↔2 사이 실측값 (건 -11.71°)
        note: 미측정. Y 가 1↔2 사이보다 덜 심하다는 근거로 그 값을 깐 것
      - gun: 2.00           # 12시와 3번(+4.00°) 중간
        y: [86.0, 286.4]    # [추정] 3↔4 사이 실측값 (건 +10.80°)
        note: 미측정. Y 가 3↔4 사이보다 덜 심하다는 근거로 그 값을 깐 것

    # 자세를 못 가릴 때(자세 사이) 쓰는 보수적 범위 = 네 자세와 **표본의 교집합**.
    # 어느 각도에서든 안전하다. 코드가 위 표에서 계산한다.

  # ── 결속 자세 선택 (2026-10-03 사용자 지정) ───────────────────────────────
  # 결속 지점의 X·Y 가 작업영역의 어느 사분면이냐로 자세를 고른다.
  #   X 가 xmax 쪽 → 1·4번 / xmin 쪽 → 2·3번
  #   Y 가 ymin 쪽 → 1·2번 / ymax 쪽 → 3·4번
  # 두 조건을 겹치면 사분면마다 자세가 **하나로** 떨어진다 (아래 quadrant 표).
  #
  # 이 규칙은 실측 가동범위와 방향이 맞는다 — 우연이 아니라 같은 기구 간섭의
  # 양면이다: X 를 멀리 뻗어야 하는 xmax 쪽에는 X 상한이 가장 큰 1·4번(418.7 /
  # 415.6mm)이 배정되고, ymax 쪽에는 Y 상한이 가장 큰 3·4번(319.5 / 320.1mm)이
  # 배정된다. 즉 규칙을 지키면 envelope 위반이 잘 안 난다.
  #
  # [검증 2026-10-03] 사분면 면적으로 따져 보면 xmax 쪽 두 사분면은 배정 자세가
  #   **최선**이다. xmin 쪽 두 사분면은 1번/4번이 각각 0.7% / 0.3% 넓게 나오는데,
  #   그쪽은 X 상한이 걸리지 않아 Y 만 효과가 있고 차이가 측정 오차 수준이다 —
  #   사실상 동등하므로 규칙대로 둔다.
  # 규칙이 못 덮는 곳은 **어느 결속 자세로도 못 가는 곳**과 같다 (규칙 손실 0):
  #   X > 408.7mm (최대는 1번), Y < 50.9mm (최소는 1번), Y > 310.1mm (최대는 4번).
  #   전부 여유 10mm 를 포함한 값이다. (12시는 결속 자세가 아니라 제외하고 본다)
  #
  # ⚠ 경계값의 의미: "절반" 은 **축 전 행정(stroke_mm)의 중앙**으로 잡았다.
  #   X 453.7/2 = 226.85, Y 349.1/2 = 174.55 (준비자세 y_mm 과 같은 값).
  #   가동범위(0~383mm 교집합)의 중앙이 아니라 **행정**의 중앙이다 — "전체 작업영역"
  #   을 축이 갈 수 있는 전 구간으로 읽었다. 가동범위 기준으로 바꾸려면 이 두 숫자만
  #   고치면 된다 (X 191.6 / Y 182.2 가 교집합 중앙이다).
  pose_select:
    x_mid_mm: 226.85
    y_mid_mm: 174.55
    # "정확히 절반지점에서는 당시 자세로" — 부동소수에서 정확한 일치는 사실상
    # 일어나지 않으므로, 중앙 ±이 폭 안을 "절반지점" 으로 본다. 이 안에서는
    # **자세를 바꾸지 않는다** (불필요한 yaw 회전과 경계에서의 떨림을 막는다).
    deadband_mm: 2.0
    quadrant:                # x쪽_y쪽: 자세번호
      x_max_y_min: 1
      x_max_y_max: 4
      x_min_y_min: 2
      x_min_y_max: 3
  # Z 는 자세별 간섭을 재지 않았다 — 스트로크만 본다. [미측정]

  # ── 준비자세 (호밍 완료 후 작업 시작 자세) ────────────────────────────────
  # X·Z 는 호밍 끝난 자리(x_min / z_min 상단) 그대로 두고 Y·Yaw 만 옮긴다.
  # **순서가 중요하다: Y 먼저, yaw 나중.** Y 는 yaw 가 12시일 때만 리미트에 닿는다고
  # 기록돼 있다. 중앙은 스트로크 중간이라 아마 괜찮겠지만, 검증된 조건(yaw 12시)에서
  # Y 를 먼저 옮기는 쪽이 안전하다 — yaw 를 먼저 1번으로 돌리면 Y 가 막히는지 모른다.
  ready:
    order: [y, yaw]
    y_mm: 174.55             # 스트로크 349.1mm 의 중앙
    yaw_pose: 1              # pose_offset_from_noon_gun_deg 의 키
    speed_dps: 60            # 모터축. 아는 거리를 가므로 위치 제어로 보낸다
  # 모터 모델·감속비 — 주행(X4-36, 36)과 다르다. 가감속 환산에 반드시 필요하다.
  # [확정] 2차년도 process/260914.md: X4-10 감속비 12.5 / X4-36 감속비 36 (비 2.88)
  model: RMD-X4-10
  gear: 12.5
  # 가감속은 **모터축 기준**이다. 출력축 = 설정값 ÷ 12.5
  #   5000  → 400 dps/s  (50dps 도달 125ms)   ← 초기값
  #   15000 → 1200 dps/s (42ms)
  #   20000 → 1600 dps/s (31ms)
  # 참고: 2차년도가 주행에 의도한 출력축 램프는 96 dps/s (DRIVE_ACCEL=3456=96×36) 였다.
  #       상부를 1200~1600 으로 두면 그보다 12~16배 급하다.
  # ⚠ X4 계열은 0x43 이 ROM 에 남지 않는다 → **매 기동 재적용 필요**
  #   (주행은 robot_control_service.sh 가 해주지만 상부는 아직 그 처리가 없다)
  rom_accel: 5000            # [미확정] 체감 튜닝 중 (2026-09-30)
  rom_decel: 5000            # [미확정] 정지가 늘어지면 올린다
  # [잠정] 상부 4축 공통 전류 임계. 3차년도 실측 없음
  current:
    rated_a: 7.8
    warning_a: 9.0
    danger_a: 12.0
    emergency_a: 15.0
  # [확정] 텔레옵 기본 속도. n/m 키로 5~100 조절
  default_speed_dps: 50.0

# 브레이크 정책
brake:
  release_command: 0x77
  lock_command: 0x78
  # [확정] 해제는 휘발성이다. 노드 재시작·전원 재투입하면 다시 잠긴다
  volatile: true
  # Z 는 낙하 위험이 있어 기동 시 자동 해제에서 제외한다
  auto_release_on_start: [x, y]
  never_auto_release: [z]
