# CAN Device Configuration

can_parser:
  ros__parameters:
    motor_can_interface: 'can2'
    remote_can_interface: 'can3'
    motor_can_bitrate: 1000000  # 1Mbps
    remote_can_bitrate: 250000  # 250kbps

can_sender:
  ros__parameters:
    can_interface: 'can2'
    can_bitrate: 1000000  # 1Mbps
    left_motor_id: 0x141
    right_motor_id: 0x142
    lateral_motor_id: 0x143
    wheel_radius: 0.02865  # meters (0x141/0x142: 1 rev = 0.18 m)
    # ★ [2026-09-09] 0x141을 X4-36으로 교체 → **느린 쪽에 맞춰 좌우 포화점을 통일**한다.
    #   X4-10 정격 238 rpm(1428 dps = 0.428 m/s) / X4-36 정격 83 rpm(498 dps = 0.249 m/s).
    #   238로 두면 0.249 m/s 위에서 X4-36만 포화해 **한쪽으로 돈다**.
    #   83으로 낮추면 둘 다 같은 지점에서 잘려 직진이 유지된다.
    #   자율결속 0.15 m/s(=300 dps)는 정격의 60%라 영향 없다.
    #   수동 최대는 0.250 → 0.249 m/s 로 사실상 그대로.
    # ★ [2026-09-14] **양쪽 다 X4-36으로 통일**. 83은 이제 "느린 쪽에 맞춘 타협값"이
    #   아니라 **양쪽의 정격 그 자체**다. 값은 그대로 두되 의미가 바뀌었다.
    #   ⚠ 양쪽 다 X4-10으로 되돌리면 238로 복구할 것.
    wheel_max_speed_rpm: 83.0
    # ⚠️ [폭주방지 2026-08-06] 모터측 통신두절 보호(0xB3). Jetson 프리즈 시 SW 워치독은
    #   같이 멈춰서 무용지물 → 모터 자체가 이 시간 안에 명령 못 받으면 스스로 정지.
    #   주행모터(0x141/0x142)에만 적용. 0x92 폴링(20Hz=50ms) + 0xA2가 하트비트라 정상 시엔 안 걸림.
    #   ⚠️ 스테이지/yaw엔 절대 걸지 말 것(유휴 시 명령 끊겨 오작동). 0 = 비활성.
    drive_motor_watchdog_ms: 500  # ms (0=off). Jetson 두절 500ms 후 주행모터 자동정지
    # ★ [2026-08-14] 주행모터 토크 상한 — 0xA2 프레임 DATA[1] (정격전류의 %, 1%/LSB).
    #   **0 = 제한 없음**(모터 설정의 스톨 전류까지 허용)이 기존 상태였다.
    #   왜: **주행모터 과부하 순간 젯슨이 즉사**하는 현상이 재현됨(3~4/3~4).
    #       배근 간격 넓은 구간에서 궤도가 빠졌다 올라올 때 토크가 치솟는다.
    #       drive_controller의 SW 거버너는 20Hz 외부루프라 µs 과도전류를 못 잡는다
    #       (6A 제한을 걸고도 13~16A 관측) → **모터 내부 전류루프**에서 잘라야 한다.
    #   모터: 0x141/0x142 = RMD **X4-10** (정격 2.5~3Nm, 최대 6Nm)
    #        ★ [2026-09-14] 둘 다 **X4-36**으로 교체됨(정격 10.5 N·m, 최대 34 N·m).
    #          아래 % ↔ A 실측 이력은 전부 **X4-10 기준**이니 그대로 옮기지 말 것.
    #       150 = 정격의 1.5배 ≈ 4Nm. 최대치(6Nm)의 2/3라 모터에 무리 없고,
    #       무제한이던 기존보다 **엄격한** 설정이다.
    #   ★ [2026-08-18] 데이터시트 확보 — 역산이 맞았음이 확인됨:
    #        X4-10: 정격 상전류 **7.8 A(rms)** = 11.0 A 진폭 / 최대 상전류 **19.5 A(rms)** = 27.6 A 진폭
    #        (감속비 12.5, 정격토크 4 N·m, 최대토크 10 N·m, 토크상수 0.8 N·m/A)
    #        우리가 읽는 값은 **진폭(iq)** 이고 rms는 ÷√2. 설정과 실측이 정확히 일치한다:
    #          80% → 8.8 예상 / 8.9 실측   120% → 13.2 / 13.3   150% → 16.5 / 16.0
    #        ⟹ **상한은 250%** (27.6 A 진폭 = 19.5 A rms = 최대토크 10 N·m). uint8 255가
    #          마침 그 언저리라 설정 범위 자체가 스펙을 크게 못 넘는다.
    #   판정: 13.3A(120%)는 최대의 48%, 16.0A(150%)는 58%로 **전혀 과하지 않다**.
    #        주행 평균은 2.7~3.3 A(rms)로 연속정격(7.8)의 35~43%에 불과하다.
    #   튜닝 이력: 150 → 피크 16.0A, **여전히 프리즈**. → 80으로 하향(피크 8.9A) → **역시 프리즈**.
    #        ⟹ 전류를 3배 넘게 줄여도 안 멎었다 = **전류 크기는 방아쇠가 아니다.**
    #   [2026-08-18] 젯슨 전원을 **외부 어댑터로 분리**(모터 전력계에서 떼어냄, 20.07V 확인).
    #        프리즈 대책이 전원 쪽으로 옮겨갔으므로 토크를 희생할 이유가 없어졌다.
    #        굵은 철근 배근을 못 넘는 문제가 생겨 **80 → 120** 으로 상향(실측 피크 13.3A) → 통과 성공.
    #        이후 여유를 더 두려고 **120 → 180** 상향(예상 19.9 A 진폭 = 14.0 A rms, 최대의 72%).
    #   ⚠ 180% 이상 쓸 때 확인할 것:
    #     · 19.5 A(rms)는 **피크** 정격이지 연속이 아니다. 고부하가 수십 초 이어지면
    #       0x9A로 모터 온도를 확인할 것(연속 정격은 7.8 A rms).
    #     · 전류가 커지면 dI/dt도 커져 **프리즈 위험이 다시 오른다**. 배터리 전원으로
    #       되돌릴 때는 **정식 전원 분리를 끝낸 뒤** 올릴 것.
    #     · 모터는 10 N·m을 견디게 설계됐으나 **궤도·감속기·체결부가 받아낼지는 별개**다.
    #       단계적으로 올리며 이상음·유격을 확인할 것.
    #   ⚠ 판정 기준: "안 죽는 토크"와 "궤도를 올라올 수 있는 토크"가 **겹치지 않으면**
    #      토크 조절로는 해결 불가 → 전원/접지 분리로 가야 한다.
    #   ⚠ 관절/스테이지 모터엔 적용하지 않는다(결속 정밀도 훼손). can_sender의
    #     `_send_speed_command`(주행)에만 실리고 `_send_speed_command_joint`는 0이다.
    #   ⚠ 전류 절대값 신뢰 주의: can_parser 환산(raw×0.01A)이 X4-10 정격 대비
    #     10배(28.3A)로 나와 스케일이 의심된다. **상대 변화만** 볼 것.
    # ★ [2026-09-14] 양쪽 X4-36 통일로 **180 → 69**. 아래 이력의 "180"은 X4-10 기준
    #   이며, 절대 토크로는 7.2 N·m 였다. X4-36에서 같은 7.2 N·m는 69%다.
    max_torque_pct: 69
    # ★ [2026-09-09] 좌우 모터 모델이 달라지면 여기서 따로 준다.
    #   max_torque_pct 는 **정격전류의 %** 라 정격이 다르면 절대 토크가 달라진다:
    #       X4-10   정격 4.0 N·m × 180% =  7.2 N·m
    #       X4-36   정격 10.5 N·m × 180% = 18.9 N·m  ← 2.6배
    #   0x141만 X4-36이던 시절엔 좌측만 69로 깎아 좌우 7.2 N·m를 맞췄다.
    # ★ [2026-09-14] **양쪽 다 X4-36** → 좌우 비대칭 보정이 필요 없어졌다.
    #   위 max_torque_pct 를 **69**로 내리고 좌우 모두 -1(=공용값)로 되돌린다.
    #   69%인 이유: 10.5 N·m × 69% = **7.2 N·m**. X4-10 한 쌍이던 시절
    #   "굵은 철근을 타고 넘을 수 있는" 값으로 현장 검증된 절대 토크가 7.2 N·m다.
    #   모터만 바꾸고 **차체가 받는 토크는 그대로** 두는 게 변수 하나만 바꾸는 길이다.
    #   ⚠ 만약 철근을 못 넘으면 **좌우를 같이** 올린다(한쪽만 올리면 즉시 틀어진다).
    #     다음 단계는 100% = 10.5 N·m. 100%는 X4-36의 **연속 정격**이라 열적으로
    #     안전하다 — 옛 X4-10의 180%는 연속 정격을 넘긴 값이었고 실제로 한 대가
    #     96°C까지 타서 죽었다([[drive_motor_0x141_stall_2026-09-09]]).
    #   -1 = 위 max_torque_pct 사용.
    left_max_torque_pct: -1    # 0x141 = X4-36 → 공용 69% (7.2 N·m)
    right_max_torque_pct: -1   # 0x142 = X4-36 → 공용 69% (7.2 N·m)
    # ★ [2026-09-14] 직진 드리프트 **잔여 보정** (좌우 속도지령 배율, 1.0 = 보정 없음).
    #   모터 파라미터를 좌우 똑같이 맞춘 **뒤에도** 남는 편차만 여기서 잡는다.
    #   ⚠ 순서: ① check_drive_pair.py 로 가감속·토크·최고속 일치 확인
    #          ② 궤도 장력 좌우 비교 (기계적 원인이 먼저다)
    #          ③ 그래도 남는 편차만 트림으로
    #   ⚠ 기계 문제를 트림으로 덮으면 한쪽에 부하가 쏠린 채 숨는다 —
    #     0x141이 죽은 게 정확히 그 패턴이다.
    #   교정: 평탄한 곳에서 직진만 주고 3 m 주행 → 뒤처지는 쪽을 올린다.
    #     예) 우측이 앞서 좌로 휘면  left 1.02 / right 0.98 처럼 반씩 나눠 준다
    #        (한쪽만 키우면 그쪽이 먼저 포화해 최고속에서 다시 틀어진다).
    #   범위 0.8~1.2 로 강제 클램프. 그 밖이면 트림이 아니라 기계 점검 대상.
    left_speed_trim: 1.0
    right_speed_trim: 1.0
    # ⚠️ [2026-08-14] 횡이동(0x143) 토크 제한. 위 max_torque_pct는 주행모터(0xA2)에만
    #   걸려서 **횡이동은 그동안 무제한**이었다 → 횡이동 직후 프리즈 재현.
    #   0xA9(Force Control Position)로 전환해 제한을 건다. 횡이동은 로봇 전체를
    #   옆으로 미는 동작이라 부하가 클 수밖에 없다.
    #   실측 2026-08-14: 100% ❌ / 150% ❌(속도 200dps 원복해도 동일) / 200% ❌
    #     / 200% + 위치계획 가속 1000→10000 ❌ (가속은 무관) / **255% ✅ 넘어감**
    #   ⟹ 횡이동 필요 토크 = 정격의 200~255%. 로봇에서 유일하게 **스톨 전류 부근**을
    #     쓰는 동작이다(주행모터는 80%=8.9A로도 돈다). 프리즈가 횡이동 직후와
    #     궤도 이탈·복귀 순간에 반복되는 것과 조건이 일치한다.
    #   ⚠ 255%는 스톨(주행모터 역산 ≈265%) 바로 아래라 전류 감소폭이 작다.
    #     이것만으로 프리즈가 멎을 것으로 기대하기는 어렵다.
    #   ※ 0x143 위치계획 가감속은 ROM에 1000→10000으로 써둠(rmd_accel.py, 재시작 무관).
    #   → 횡이동은 **정격의 1.5배 초과** 토크를 실제로 요구한다. 로봇 전체를 옆으로
    #     밀어 철근을 타고 넘는 동작이라 당연한 결과.
    #   ⚠ 단, 주행모터에서 피크를 28.3A→8.9A(3배 이상)로 줄여도 프리즈는 그대로였다.
    #     = 전류 크기가 방아쇠는 아닐 공산이 크다. 그래도 **넘어가는 최소 토크값**을
    #     알아두면 나중에 전원 분리 작업 시 필요 전류 사양의 근거가 된다.
    #   범위는 uint8(0~255). 단 모터 스톨 전류를 넘는 값을 주면 force control이
    #   작동하지 않고 스톨 전류가 상한이 된다(= 제한 없음과 동일).
    #   주행모터 역산: 150%→16.03A, 무제한→28.30A ⟹ 정격≈10.7A, 스톨≈정격의 265%.
    #   0 = 제한 없음(0xA4 원래 경로). ([[robot_freeze_safety]])
    lateral_max_torque_pct: 0

drive_controller:
  ros__parameters:
    wheel_base: 0.5  # meters (바퀴 간 거리)
    max_linear_vel: 1.0  # m/s
    max_angular_vel: 2.0  # rad/s
    speed_scale_factor: 0.25  # 속도 스케일링 (0.25 = 정격의 25%, 테스트용)
    joystick_deadzone: 20  # 조이스틱 데드존 (0-127 범위)
    joystick_center: 127  # 조이스틱 중립값
    publish_frequency: 20  # Hz (Tire Roller 방식 - 주기적 발행)
    # ★ [2026-09-14] 슬루율(지령 가감속 제한). 전엔 코드 기본값(0.25/0.8)만 있어
    #   yaml 에 안 보였다 → 튜닝 대상인데 안 보이면 아무도 못 고친다. 명시한다.
    #
    #   ⚠ 가속과 감속의 성격이 정반대다:
    #     · **가속**(accel_limit_mps2)은 전류 피크를 만든다. 실측 평균 4.8A인데
    #       피크 28.3A(6배)까지 튀었고 그 과도구간에서 **시스템 프리즈가 재현**됐다
    #       ([[robot_freeze_safety]] 2026-08-14). → **올리지 말 것.** 0.25 유지.
    #     · **감속**은 회생(에너지를 뽑아내는 쪽)이라 같은 위험이 없다. 이 장비 속도에서
    #       운동에너지는 5 J 수준(≈50 W 회생)이라 무시할 만하다.
    #
    #   0.8 → 2.5 로 올린 이유 (정지 지연 실측·계산, 2026-09-14):
    #     리모콘 수동주행은 자율주행의 근접감속(approach_scale)이 없어 지령이
    #     **계단으로** 0이 된다. 0.19 m/s 에서 정지까지 62mm·0.60s 였고 그 분해는
    #       모터 0x43 감속 1200 → 30mm (48%)
    #       이 슬루      0.8  → 23mm (37%)
    #       지령지연     20Hz → 10mm (15%)
    #     감속 쪽 둘을 같이 올려야 의미가 있다(모터 쪽은 robot_control_service.sh).
    #     2.5 로 하면 0.19 m/s 에서 26mm·0.24s. 0 으로 두면 무제한(권장하지 않음 —
    #     지령이 계단이 되어 모터 감속만 남고, 급정지 충격이 결속부로 간다).
    accel_limit_mps2: 0.25   # m/s² 가속 한계. ⚠ 올리지 말 것(전류 피크·프리즈)
    decel_limit_mps2: 2.5    # m/s² 감속 한계. 0이면 무제한
    lateral_position_tolerance: 1.0  # 도달 판정 오차 (deg) - 1회전=5cm 기계 정밀도
    # RMD X4-36 엔코더: uint16 (0~65535) = 360° (출력축 기준, 감속 후)
    # 실측 (2025-12-18): 평균 360 counts/360° → 360 CPR
    lateral_encoder_cpr: 360.0  # counts per revolution (출력축, 실측값)

joint_controller:
  ros__parameters:
    # === 횡이동 모터 (0x143) ===
    # lateral_step_deg: 3240.0  # S17, S18 단위 (degree) - 9회전=396mm
    lateral_step_deg: 360.0  # 1회전 = 70mm (HW 업그레이드 후, 기존 44mm)
    # ★ [2026-09-14] 12시(안착·중립) 위상. **모터 교체 시 반드시 재측정**한다.
    #   횡이동은 매번 "가장 가까운 12시(이 값 + n*360)로 정렬 + 1회전"을 한 명령으로
    #   실행한다(joint_controller `_handle_lateral_with_home` / `_handle_auto_lateral_motion`).
    #   기구가 평행4절이라 **회전 위상 = 승강 상태**다. 이 값이 틀리면 엉뚱한 위상에서
    #   멈춰 기구가 들린 채 남는다(낙하 위험).
    #   ⚠ 이름은 _94 지만 실제 비교 대상은 **0x92 멀티턴 각도 % 360** 이다.
    #   ⚠ 코드 기본값(joint_controller 16.38)은 **구 모터 값**이다. 여기서 덮어쓴다.
    #   측정: 기구를 물리적 12시에 둔 뒤 0x92 를 읽어 %360.
    #
    #   ★ 2026-09-15 정정: "0x94는 V4.4에서 못 쓴다(=0.00)"고 적어뒀던 건 **틀렸다.**
    #     펌웨어가 아니라 **can_parser가 엉뚱한 바이트를 읽고 있었다.**
    #       실제 응답 [94,00,00,00, 1C,08,00,00] → DATA[4:8] uint32 = 20.76°
    #       구형 문서대로 DATA[6:8] uint16 을 읽으면 항상 0x0000 = 0.00°
    #     parser를 고쳐 이제 0x94도 정상이다(0x92와 완전히 일치). 0x90은 실제로 무응답.
    #     이 오독 때문에 `home_encoder` 자동설정과 12시 정렬 완료판정이 여태 죽어 있었다.
    #
    #   측정 이력:
    #     2026-09-14 모터 교체 후 = 19.26° (구값 16.38 대비 +2.88)
    #     2026-09-15 횡이동 축 해체·재조립 후 = 20.76° (+1.50)
    #     2026-09-18 축 재해체·재조립 후 = 132.73° (+111.97)
    #     2026-09-22 **축 재조립 후 = 171.68°** (+38.95, 0x92·0x94 동일, 10회 편차 0)
    #       ⚠ 분해할 때마다 매번 옮겨간다(+2.88 → +1.50 → +111.97 → +38.95).
    #         커플링을 물리는 각도가 그때그때 달라 0x92 원점이 통째로 이동하기 때문이다.
    #         → **분해했으면 반드시 재측정할 것.** 이전 값을 물려받으면 기구가
    #           엉뚱한 위상에서 멈춰 들린 채 남는다(낙하 위험).
    #       측정법: 기구를 물리적 12시에 둔 뒤
    #         0x143 에 0x92 를 쏘고 응답 DATA[4:8] int32 ×0.01 → %360
    home_angle_94: 171.68
    # RMD X4-36 (0x143): 정격 속도 83rpm (498 dps)
    # ⚠️ [2026-08-14] 옛 주석("150dps → 실속도 37.6dps")은 HW 업그레이드 前 값이라 폐기.
    #   실관측: 360° 1회전에 약 2초 ≈ 180 dps로, 명령값(200)에 거의 도달한다.
    #   횡이동 중 프리즈가 재현되어 100으로 낮춰봤으나 **철근을 못 넘어가서 원복**.
    #   철근을 타고 넘으려면 관성이 필요한데 180→100dps면 운동에너지가 1/3로 준다.
    #   → 속도는 유지하고 토크 상한(lateral_max_torque_pct)으로만 조인다.
    #   ([[robot_freeze_safety]])
    #   ※ 0x143은 위치명령(0xA4/0xA9) 응답이 1회뿐이라 이동 중 속도·전류가
    #     /motor_feedback에 안 잡힌다. 계측하려면 이동 중 0x9C 폴링이 필요.
    #   ★ [2026-09-02] 90 → 70 시도했다가 **90으로 원복**. 속도 문제가 아니었다.
    #     0x9C 20Hz 폴링 실측(tools/diag/plot_lateral_current_2026-09-02.py):
    #       무부하 90dps(11회) 평균 3.3A · 피크 4.8A · 5.2초 · 최고속 81dps
    #       무부하 70dps( 4회) 평균 3.0A · 피크 4.2A · 5.2초 · 최고속 64dps
    #       배근 위 70dps( 3회) 피크 **30.5 / 30.2 / 30.0A 전부 포화, 전부 미도달**
    #                          2.4s → 1.2s → 0.4s, 36 → 65°C (시도할수록 빨리 죽음)
    #     30.47A(진폭) ÷ √2 = 21.55 A(rms) = 데이터시트 최대 상전류 21.5 A(rms).
    #     ⇒ **최대 토크 34 N·m를 100% 쓰고도 못 넘는다 = 토크 부족.**
    #       속도·가감속으로는 못 푼다. 대책은 기구(승강 50~60mm 축소 / 중력보상
    #       스프링)뿐이다. ([[lateral_motor_sizing]])
    #     ※ 드라이버 가감속: 위치계획 **감속 2100 → 600 dps/s**(0x43 index 0x01,
    #       ROM 저장)로 낮춘 상태를 유지 중. 가속은 2100 — 90dps 도달에 43ms,
    #       회전각 1.9°/360°라 키워도 의미가 없다.
    lateral_max_speed: 90.0  # 0x143 최대 속도 (dps) - 정격: 498 dps
    # ⚠️ [2026-08-18] 횡이동 미도달 보호 — 제한시간 내 목표 미달이면 **출발 위치로 복귀**.
    #   왜: 0x143은 위치명령(0xA4)이라 도달할 때까지 최대 토크로 버틴다. 0xB3 워치독은
    #     낙하 위험 때문에 못 걸어서 스스로 안 풀린다 → 실제로 이날 철근을 못 넘고
    #     버티다 **모터에서 타는 냄새**가 났고 스톨 알람(0x0002)이 래치됐다.
    #   ⚠ 복귀는 토크를 끊지 않는다(0x80/0x81 금지 — 들려 있던 기구가 낙하한다).
    #   실측: 정상 1회전 약 5.5초(80dps) → 15초면 충분한 여유. 0 = 비활성.
    #   ※ 스톨 알람 해제는 **0x76 System Reset**이 필요하다.
    #     0x80/0x88/0x9B 조합으로는 안 풀리는 것을 실측 확인(2026-08-18).
    lateral_timeout_sec: 8.0
    lateral_return_speed: 60.0   # 복귀 속도 (dps) — 정상 이동보다 느리게

    # === Yaw 모터 (0x147) ===
    yaw_step_deg: 45.0  # S23, S24 단위 (degree)
    yaw_max_speed: 134.0  # 0x147 최대 속도 (dps)

    # === 3축 스테이지 (0x144, 0x145, 0x146) - 2026-03-04 실측 ===
    # X축 스테이지 (0x144) - AN1 조이스틱 제어
    stage_x_step_deg: 4.497     # 1mm = 4.497° (0x144) - P2P 실측 보정
    stage_x_max_speed: 200.0    # dps

    # Y축 스테이지 (0x145) - AN2 조이스틱 제어
    stage_y_step_deg: 4.462     # 1mm = 4.462° (0x145) - P2P 실측 보정
    stage_y_max_speed: 200.0    # dps

    # Z축 스테이지 (0x146) - S21(하강)/S22(상승) 버튼 제어
    stage_z_step_deg: 13.45     # 1mm ≈ 13.45° (실측: 100mm명령→20mm이동, 2.69*5)
    stage_z_max_speed: 200.0    # dps

    # 조이스틱 설정
    joystick_deadzone: 0.15     # 15% 데드존 (-1.0 ~ 1.0 범위)
    joystick_scale: 1.0         # 조이스틱 감도 스케일

    # 명령 간격
    # command_interval: 20.0  # 명령 간 최소 간격 (초) - 3240°/200dps≈16초 + 여유
    command_interval: 6.0  # 1회전 모드용 (360°/200dps≈1.8초 + 여유)

    # 리밋 센서 사용 여부
    use_limit_sensors: true  # false로 설정하면 리밋 체크 비활성화

    # === 호밍 설정 (2026-03-05) ===
    homing_speed: 100.0           # 거시적 호밍 속도 (dps)
    homing_fine_speed: 30.0       # 미시적 호밍 속도 (dps)
    homing_backoff_time: 0.5      # 리미트 후퇴 시간 (초)
    homing_timeout: 30.0          # 단계별 타임아웃 (초)

    # Yaw 0x90 절대 엔코더 (16-bit, 전원 꺼져도 유지)
    # 2026-08-06 요축 모터 교체 후 재실측 (구모터: home=61857, max=25896, stroke=399.0, th=43000)
    # 신모터는 wrap 없음 (home < max 단순증가). 스케일 73.88 counts/deg (구 74.12와 일치)
  # ★ 2026-09-02 요축 모터 **탈착 후 재실측**. 홈 리미트가 물린 상태에서
  #   0x90=11245 (이전 17994 대비 -6749 counts ≈ 출력축 91°).
  #   ⚠ max/th는 가동범위 29600 counts가 그대로라는 가정의 계산값.
  #     좌우 자세가 어긋나면 좌측 끝에서 0x90을 실측해 max를 다시 잡을 것.
  #   ⚠ 모터를 탈착할 때마다 다시 재야 한다.
    yaw_home_encoder_90: 10978    # 2026-09-02 실측(홈 리미트 ON, 0x92=+15.07°)
    yaw_max_encoder_90: 34145     # 2026-09-02 실측(MAX 끝, 0x92=+406.89°)
    yaw_full_stroke_deg: 391.82   # 2026-09-02 실측(홈~MAX 0x92 차이). 23167 counts / 59.13 counts-per-deg
    yaw_left_threshold_90: 22562  # (home+max)/2, 로그 표시용
                                  # (실판정은 _is_yaw_left()가 home/max로 직접 계산, 이 값 미사용)

    # 준비 위치 오프셋 (홈 위치 기준)
    # Orbbec 검출자세는 orchestrator가 (0,100,100)로 이동 → 호밍 X 경유(-300) 불필요, 0으로
    ready_x_mm: 0.0             # X축 (0=홈, orchestrator가 검출자세로 최종이동)
    ready_y_mm: 0.0              # Y축 (y_min 기준, mm)
    ready_z_mm: 0.0              # Z축 (z_min 기준, mm)
    ready_yaw_deg: 0.0            # Yaw (홈 센서 기준, deg) - 2026-03-15 오프셋 0으로 변경

homing_controller:
  ros__parameters:
    # YAW_SAFE에서 yaw_home 리미트 접근 속도 (dps)
    # 너무 빠르면 센서 감지 전 기계스톱 충돌 → 낮출 것 (정밀 호밍은 FINE_HOME이 담당)
    # 기존 50dps(homing_speed*0.5)에서 충돌 발생 → 25로 하향 (2026-06-20)
    yaw_home_approach_speed: 25.0

    # Yaw 0x90 절대 엔코더 — YAW_CHECK의 Left/Right 판정에 실제로 쓰이는 값.
    # ⚠️ homing_controller는 위 joint_controller: 섹션을 읽지 않으므로 여기 있어야 반영됨.
    # 2026-08-06 요축 모터 교체 후 재실측 (구모터: home=61857, max=25896)
  # ★ 2026-09-02 요축 모터 **탈착 후 재실측**. 홈 리미트가 물린 상태에서
  #   0x90=11245 (이전 17994 대비 -6749 counts ≈ 출력축 91°).
  #   ⚠ max/th는 가동범위 29600 counts가 그대로라는 가정의 계산값.
  #     좌우 자세가 어긋나면 좌측 끝에서 0x90을 실측해 max를 다시 잡을 것.
  #   ⚠ 모터를 탈착할 때마다 다시 재야 한다.
    yaw_home_encoder_90: 10978    # 2026-09-02 실측(홈 리미트 ON, 0x92=+15.07°)
    yaw_max_encoder_90: 34145     # 2026-09-02 실측(MAX 끝, 0x92=+406.89°)
    yaw_full_stroke_deg: 391.82   # 2026-09-02 실측(홈~MAX 0x92 차이). 23167 counts / 59.13 counts-per-deg
    yaw_left_threshold_90: 22562  # (home+max)/2, 로그 표시용

    # 준비 위치 오프셋 (홈 기준) — homing_controller가 READY에서 실제 사용하는 값.
    # Orbbec 검출자세는 orchestrator가 (0,100,100)로 이동하므로 호밍 X경유 불필요 → 0
    # (기존엔 이 섹션에 없어 코드 기본값 -300이 쓰여 X 3단계 이동했음)
    ready_x_mm: 0.0
    ready_y_mm: 0.0
    ready_z_mm: 0.0
    ready_yaw_deg: 0.0

encoder_odom:
  ros__parameters:
    wheel_radius: 0.02865     # m (1 rev = 0.18m)
    wheel_base: 0.5           # m (바퀴 간 거리)
    publish_rate: 20.0        # Hz
    left_motor_id: 0x41       # CAN parser 변환 ID (0x141 → 0x41)
    right_motor_id: 0x42      # CAN parser 변환 ID (0x142 → 0x42)
    dps_to_mps_scale: 0.989   # 캘리브레이션 보정 계수 (실측: 710mm/718mm) - speed 모드 전용
    odom_mode: 'position'     # 'position': 0x92 각도 차분 (정밀) / 'speed': dps 적분 (기존)

ezi_io_controller:
  ros__parameters:
    # EZI-IO 모듈 연결 설정
    ip_address: '192.168.0.6'
    board_id: 0
    update_rate: 20.0  # Hz

    # 리미트 센서 채널 매핑 (FASTECH EZI-IO-EN-L16O16N-T)
    # X축 스테이지 (0x144)
    limit_x_min_channel: 2   # IN02
    limit_x_max_channel: 3   # IN03
    # Y축 스테이지 (0x145)
    limit_y_min_channel: 1   # IN01
    limit_y_max_channel: 0   # IN00
    # Z축 스테이지 (0x146)
    limit_z_min_channel: 5   # IN05
    limit_z_max_channel: 6   # IN06
    # Yaw 원점 (0x147)
    limit_yaw_home_channel: 4  # IN04
