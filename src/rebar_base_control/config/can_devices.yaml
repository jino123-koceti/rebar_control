# CAN Device Configuration

can_parser:
  ros__parameters:
    motor_can_interface: 'can2'
    remote_can_interface: 'can3'
    motor_can_bitrate: 1000000  # 1Mbps
    remote_can_bitrate: 250000  # 250kbps

can_sender:
  ros__parameters:
    can_interface: 'can2'
    can_bitrate: 1000000  # 1Mbps
    left_motor_id: 0x141
    right_motor_id: 0x142
    lateral_motor_id: 0x143
    wheel_radius: 0.02865  # meters (0x141/0x142: 1 rev = 0.18 m)

drive_controller:
  ros__parameters:
    wheel_base: 0.5  # meters (바퀴 간 거리)
    max_linear_vel: 1.0  # m/s
    max_angular_vel: 2.0  # rad/s
    speed_scale_factor: 0.25  # 속도 스케일링 (0.25 = 정격의 25%, 테스트용)
    joystick_deadzone: 20  # 조이스틱 데드존 (0-127 범위)
    joystick_center: 127  # 조이스틱 중립값
    publish_frequency: 20  # Hz (Tire Roller 방식 - 주기적 발행)
    lateral_position_tolerance: 1.0  # 도달 판정 오차 (deg) - 1회전=5cm 기계 정밀도
    # RMD X4-36 엔코더: uint16 (0~65535) = 360° (출력축 기준, 감속 후)
    # 실측 (2025-12-18): 평균 360 counts/360° → 360 CPR
    lateral_encoder_cpr: 360.0  # counts per revolution (출력축, 실측값)

joint_controller:
  ros__parameters:
    # === 횡이동 모터 (0x143) ===
    lateral_step_deg: 3240.0  # S17, S18 단위 (degree) - 9회전=396mm
    # lateral_step_deg: 360.0  # 1회전=44mm (미세 조작용)
    # RMD X4-36 (0x143): 정격 속도 83rpm (498 dps)
    # 테스트 결과: 150dps → 실속도 37.6dps (25%), 200dps로 상향 시도
    lateral_max_speed: 200.0  # 0x143 최대 속도 (dps) - 정격: 498 dps

    # === Yaw 모터 (0x147) ===
    yaw_step_deg: 45.0  # S23, S24 단위 (degree)
    yaw_max_speed: 134.0  # 0x147 최대 속도 (dps)

    # === 3축 스테이지 (0x144, 0x145, 0x146) - 2026-03-04 실측 ===
    # X축 스테이지 (0x144) - AN1 조이스틱 제어
    stage_x_step_deg: 4.497     # 1mm = 4.497° (0x144) - P2P 실측 보정
    stage_x_max_speed: 200.0    # dps

    # Y축 스테이지 (0x145) - AN2 조이스틱 제어
    stage_y_step_deg: 4.462     # 1mm = 4.462° (0x145) - P2P 실측 보정
    stage_y_max_speed: 200.0    # dps

    # Z축 스테이지 (0x146) - S21(하강)/S22(상승) 버튼 제어
    stage_z_step_deg: 13.45     # 1mm ≈ 13.45° (실측: 100mm명령→20mm이동, 2.69*5)
    stage_z_max_speed: 200.0    # dps

    # 조이스틱 설정
    joystick_deadzone: 0.15     # 15% 데드존 (-1.0 ~ 1.0 범위)
    joystick_scale: 1.0         # 조이스틱 감도 스케일

    # 명령 간격
    command_interval: 20.0  # 명령 간 최소 간격 (초) - 3240°/200dps≈16초 + 여유
    # command_interval: 6.0  # 1회전 모드용

    # 리밋 센서 사용 여부
    use_limit_sensors: true  # false로 설정하면 리밋 체크 비활성화

    # === 호밍 설정 (2026-03-05) ===
    homing_speed: 100.0           # 거시적 호밍 속도 (dps)
    homing_fine_speed: 30.0       # 미시적 호밍 속도 (dps)
    homing_backoff_time: 0.5      # 리미트 후퇴 시간 (초)
    homing_timeout: 30.0          # 단계별 타임아웃 (초)

    # Yaw 0x90 절대 엔코더 (16-bit, 전원 꺼져도 유지)
    yaw_home_encoder_90: 61857    # Yaw min (홈 센서) 위치 - 2026-03-15 재실측2 (0x90 position 기준)
    yaw_max_encoder_90: 25896     # Yaw max 위치 - 2026-03-15 재실측2 (0x92=395.56°)
    yaw_full_stroke_deg: 399.0    # Yaw 풀 스트로크 (0x92 출력축 기준, deg) - 6차 실측
    yaw_left_threshold_90: 43000  # Left/Right 판단 임계값 (0x90) - (home+max)/2 ≈ 43877, 여유있게 43000

    # 준비 위치 오프셋 (홈 위치 기준)
    ready_x_mm: -300.0           # X축 (음수=xMax 방향, 작업 시작포인트 P1 부근)
    ready_y_mm: 0.0              # Y축 (y_min 기준, mm)
    ready_z_mm: 0.0              # Z축 (z_min 기준, mm)
    ready_yaw_deg: 0.0            # Yaw (홈 센서 기준, deg) - 2026-03-15 오프셋 0으로 변경

encoder_odom:
  ros__parameters:
    wheel_radius: 0.02865     # m (1 rev = 0.18m)
    wheel_base: 0.5           # m (바퀴 간 거리)
    publish_rate: 20.0        # Hz
    left_motor_id: 0x41       # CAN parser 변환 ID (0x141 → 0x41)
    right_motor_id: 0x42      # CAN parser 변환 ID (0x142 → 0x42)
    dps_to_mps_scale: 0.989   # 캘리브레이션 보정 계수 (실측: 710mm/718mm) - speed 모드 전용
    odom_mode: 'position'     # 'position': 0x92 각도 차분 (정밀) / 'speed': dps 적분 (기존)

ezi_io_controller:
  ros__parameters:
    # EZI-IO 모듈 연결 설정
    ip_address: '192.168.0.6'
    board_id: 0
    update_rate: 20.0  # Hz

    # 리미트 센서 채널 매핑 (FASTECH EZI-IO-EN-L16O16N-T)
    # X축 스테이지 (0x144)
    limit_x_min_channel: 2   # IN02
    limit_x_max_channel: 3   # IN03
    # Y축 스테이지 (0x145)
    limit_y_min_channel: 1   # IN01
    limit_y_max_channel: 0   # IN00
    # Z축 스테이지 (0x146)
    limit_z_min_channel: 5   # IN05
    limit_z_max_channel: 6   # IN06
    # Yaw 원점 (0x147)
    limit_yaw_home_channel: 4  # IN04
