# 결속 오케스트레이터 설정
# 3축 스테이지 + 결속 시퀀스 자동화 파라미터

tying_orchestrator:
  ros__parameters:
    # 스테이지 파라미터 (2026-03-04 실측)
    deg_per_mm_x: 4.497          # X축: 1mm = 4.497° (P2P 실측 보정)
    deg_per_mm_y: 4.462          # Y축: 1mm = 4.462° (P2P 실측 보정)
    stage_max_speed_dps: 200.0   # 최대 속도 (degree/s)
    stage_settling_time: 1.5     # 이동 후 안정 대기 시간 (초)
    max_stage_timeout: 10.0      # 스테이지 이동 최대 대기 시간 (초)
    position_tolerance_deg: 5.0  # 위치 허용오차 (~1.9mm)

    # 스테이지 이동 범위 제한 (2026-03-04 실측)
    max_stage_x_mm: 420.0        # X축 스트로크 (실측)
    max_stage_y_mm: 300.0        # Y축 스트로크 (실측)
    max_yaw_deg: 243.0           # Yaw 회전 범위 (실측)

    # 결속 시퀀스 타이밍
    inter_point_delay: 0.5       # 포인트 간 대기 시간 (초)

    # 검출 재시도
    detection_retry_count: 3     # 검출 실패 시 재시도 횟수
    detection_retry_delay: 1.0   # 재시도 대기 시간 (초)
