# 결속 오케스트레이터 설정
# 3축 스테이지 + 결속 시퀀스 자동화 파라미터

tying_orchestrator:
  ros__parameters:
    # 스테이지 파라미터 (2026-03-04 실측)
    deg_per_mm_x: 4.497          # X축: 1mm = 4.497° (P2P 실측 보정)
    deg_per_mm_y: 4.462          # Y축: 1mm = 4.462° (P2P 실측 보정)
    stage_max_speed_dps: 1000.0  # 최대 속도 (degree/s)
    stage_settling_time: 1.5     # (미사용, goal 도달 확인 방식으로 전환)
    max_stage_timeout: 10.0      # 스테이지 이동 최대 대기 시간 (초)
    position_tolerance_deg: 1.0  # 위치 허용오차 (~0.22mm)

    # 스테이지 이동 범위 제한 (2026-03-04 실측)
    max_stage_x_mm: 345.0        # X축 최대 스트로크 (Orbbec 전방장착으로 411→345 감소)
    detect_x_min_mm: 30.0        # 검출 X 최소값 (이 값 미만 교차점 제거)
    max_stage_y_mm: 288.0        # Y축 전체 스트로크 (물리적 한계)
    max_yaw_deg: 399.0           # Yaw 풀 스트로크

    # Y축 자세별 가동 범위 (2026-03-18 실측, 결속기 간섭 한계)
    right_cam_y_min_mm: 0.0      # Right cam 자세 Y 최소
    right_cam_y_max_mm: 142.0    # Right cam 자세 Y 최대
    left_cam_y_min_mm: 124.0     # Left cam 자세 Y 최소
    left_cam_y_max_mm: 288.0     # Left cam 자세 Y 최대
    left_min_x_mm: 0.0         # 좌측자세 X 하한 — 저-X 결속점 검출오차로 배근 충돌 → 스킵 (0=끔)

    # Yaw 자세 (홈 기준 오프셋, 절대값 = home_ref_yaw + offset)
    # ★ 2026-09-02 재설정 — 결속공구 진입각 확보.
    #   기구 한계 실측: 좌(MAX) = 홈 +391.82° (2026-09-02, 0x90 10978→34145)
    #   우측 한계 실측: 홈 -18.29° (0x92). 양쪽 다 이번 세션 실측으로 통일됨.
    #   → **양쪽에서 3° 물러난** 값을 쓴다. 한계에 붙여두면 자세를 바꿀 때마다
    #     하드 스톱에 밀어붙여 최대토크로 버티게 된다(요축은 0xA4 위치명령이라
    #     도달할 때까지 안 놓는다 → 발열·전류·스톨 위험).
    #   전환각 393.5-(-16.0)=409.5° 였고, 3°씩 물러나 403.5°.
    #   ⚠ 우측은 기존 -3.0에서 **10° 더 돌린 값**이다(진입각 개선분).
    #   ★ [2026-09-02 후속] 호밍 완료 후 잡는 자세라 **홈 센서 쪽으로 3° 되돌린다**
    #     (-16.3 → -13.3). 하드스톱(-18.29)에서 5.0° 여유가 되어 자세 전환 때
    #     스톱에 밀어붙일 위험이 줄어든다. 진입각은 그만큼 줄어든다.
    yaw_right_cam_offset: -13.3  # 우측 한계(홈 -18.29° 실측)에서 5.0° 여유 (2026-09-02)
    yaw_left_cam_offset: 389.8   # MAX(+391.82° 실측)에서 2° 여유 (2026-09-02 사용자 지정)
    yaw_left_cam_approach_offset: 386.8  # 최종보다 3° 앞 (오버슈트 방지)
    yaw_mid_offset: 173.0        # 자세 변경 중간 경유각 (홈 기준 +173°)

    # 자세 변경 시퀀스 Y 위치
    pose_change_y_near_mm: 100.0   # 자세 변경 시 Y 근접 위치 (Right cam side)
    pose_change_y_far_mm: 250.0    # 자세 변경 시 Y 원거리 위치 (Left cam side)
    pose_change_backlash_x_mm: 0.0 # 자세변경 직후(X 0→증가) 첫 포인트 X 백래쉬 보정(mm). 0=끔

    # Z축 결속 파라미터
    z_home_offset_mm: 10.0       # 검출자세 Z 하강(실제 10mm). retract=Orbbec 가림↓
    # Orbbec 검출자세 (검출 겸 주행 위치): 우측=(0,ready_pose_y,20), 좌측=(0,detect_left_y,20)
    ready_pose_x_mm: 0.0         # 검출자세 X (홈, Orbbec 가림 최소)
    ready_pose_y_mm: 100.0       # 우측 검출자세 Y
    detect_left_y_mm: 160.0      # 좌측 검출자세 Y (좌측 자세는 Y≥124라 100 불가)
    # ⚠️ deg_per_mm_z 스케일 수정(2.69→13.45)으로 tie 깊이 재캘리 필요.
    #    지금은 안전 placeholder(20mm). 결속 테스트 시 skip_z/소폭부터 실측해 조정할 것.
    tying_z_down_mm: 53.0       # 63→58→53 (2026-09-08 또 5mm 덜 내림). 검출자세10+53=총63mm
    # tying_z_down_mm: 63.0       # 실물 검증됨(2점 결속 OK, 2026-07-04)     # 동작 테스트용 (결속 없이 Z 소폭 하강만)
    deg_per_mm_z: 13.45           # Z축: 1mm=13.45° (호밍 캘리브값. 기존 2.69는 5배 오류였음)
    z_speed_dps: 1000.0          # Z축 속도 (degree/s)
    z_settle_margin: 0.1         # Z축 이동 후 추가 대기 마진 (초)
    # tying_z_down_mm 변경 시 z_early_xy_mm도 함께 조정할 것
    # z_early_xy_mm = tying_z_down_mm - (대기높이까지 남은 거리)
    # ⚠ 여백(tying_z_down_mm - z_early_xy_mm)을 **5mm로 유지**한다. 이 값이 곧
    #   "XY가 움직이기 시작할 때 아직 안 올라온 높이"다. 키우면 공구가 덜 올라온
    #   채로 XY가 움직여 철근에 걸린다.
    z_early_xy_mm: 48.0         # tying_z_down 58→53 따라 53→48 (여백 5mm 유지)

    # Z축 하강 토크 모니터링 (과부하 감지 → 트리거 스킵)
    # effective_limit = base + speed_percent * scale
    # ★ 2026-09-02: 400 → 1150.  임계 = base + 속도% × scale
    #   좌측 자세 하강에서 **충돌이 아닌 가속 구간 전류 스파이크**로 과부하 오탐이
    #   30분에 4회 발생했다(실측 2520~2600mA vs 임계 2500 — 1~4% 초과).
    #   사용자 확인: 결속기가 아무것도 안 부딪혔고 가속할 때만 튄다.
    #   ⚠ 임계는 **속도에 비례**한다. 이 값은 `tie_speed_pct=50` 기준이다:
    #        50% → 1150 + 1500 = 2650mA   (사용자 지정)
    #        70% → 1150 + 2100 = 3250mA   ← 속도를 되돌리면 임계가 과하게 커진다
    #   결속 속도를 바꾸면 이 값도 다시 잡을 것.
    #   ※ 대안: z_torque_delay_ratio(0.3)를 올려 가속 구간을 검사에서 빼는 방법도 있다.
    z_torque_base_mA: 1150        # tie_speed_pct=50 기준 임계 2650mA
    z_torque_scale_mA: 30         # 속도 1%당 추가 임계값 (mA)
    # 50%→1900mA, 70%→2500mA, 100%→3400mA
    z_torque_delay_ratio: 0.3     # 하강시간 대비 체크 지연 비율 (0.3=30% 이후부터 체크)
    z_torque_poll_hz: 40.0        # 0x9C 폴링 주기 (Hz)
    # 감속 구간 충돌 감지 (정상 감속구간 전류: 300~880mA)
    z_torque_decel_mA: 1200       # 감속 구간 전류 임계값 (mA)
    z_torque_decel_ratio: 0.75    # 감속 구간 시작 비율 (z_wait_time의 75% 이후, 전환점~72%)
    z_torque_decel_count: 2       # 연속 초과 횟수 (오탐 방지, 40Hz 기준 ~50ms)

    # 트리거 파라미터
    trigger_speed: 1.0           # 트리거 모터 속도 (-1.0 ~ 1.0)
    trigger_duration: 0.3        # 트리거 동작 시간 (초)

    # 결속 시퀀스 타이밍
    inter_point_delay: 0.5       # 포인트 간 대기 시간 (초)

    # 멀티검출 파라미터
    multi_detect_tries: 5        # 다중 검출 최대 시도 횟수
    multi_detect_delay: 0.3      # 검출 간 대기 시간 (초)
    cluster_distance_mm: 40.0    # 클러스터링 거리 임계값 (mm)
    expected_points_per_cam: 3   # 카메라당 기대 포인트 수
    detection_confidence: 0.3    # 검출 confidence 임계값
    # 카메라 모드: 1=양카메라(검출→자세변경→반대카메라 Phase2), 2=우측카메라 전용(자세변경 없음)
    camera_mode: 2
    # 시연용: true면 Z 하강/상승 생략(XY·yaw·트리거만, 실제 결속 안 함). 실제 결속 시 false
    skip_z_motion: false

    # [Stage2] 툴캠 서보 미세보정 모드 (true면 zedxone YOLO+게인 로드, SERVO_ONE 명령 활성)
    # false면 기존 동작 그대로 (서보 인프라 미로드)
    # Orbbec 결속으로 전환하며 비주얼서보잉 제외 → false
    servo_mode: false
    # [Orbbec] 상단 Orbbec 1대 검출+호모그래피 지그재그 직접결속 (비주얼서보잉 대체)
    # true면 TYING_START가 Orbbec 흐름으로 (기존 zedxmini/서보 흐름 미사용)
    orbbec_mode: true
    # WP 도달 후 base 정착 대기(초) — 주행 정지 관성 후 신선 프레임으로 검출
    orbbec_settle_sec: 0.0  # rebar_controller가 정지확인 → 여기선 버퍼클리어+신선프레임(0.3s)만
    rebar_spacing_mm: 195.0      # 철근 배근 간격 (mm)
    # 좌측자세 서보 코스이동 Y (우측=ready_pose_y_mm 사용, 좌측=이 값)
    # 좌측 작업영역 Y범위 124~288mm 내에서 툴캠이 교차점을 보는 Y (좌측 캘리브 시 튜닝)
    # TODO(좌측 통합): 실측 후 조정
    servo_ready_y_left_mm: 168.0

    # ── 2층 배근: 교차점의 두 철근이 같은 층인지 보고 거른다 ──────────────
    # 하단근 세로 × 상단근 가로는 탑뷰에서 교차점처럼 보이지만 실제 결속점이 아니다.
    # 교차점 둘레를 링으로 훑어 갈래별 높이를 재고, 그 폭이 layer_gap_mm 이상이면 뺀다.
    # ⚠ 중심 depth 하나로는 못 가린다 — 위에 얹힌 철근만 보인다.
    # ★ 현장 실측(2026-09-08): 하단근 바닥+30mm / 상단근 +180mm → 층간 150mm
    #   → 임계는 그 중간 75mm (같은 층 spread≈0 / 층 혼합 spread≈150)
    # ⚠ 'on'으로 켜기 전에 반드시 현장에서 확인할 것:
    #     python3 tools/vision_test/layer_check_probe.py --watch
    #   두 무리(0 근처 / 150 근처)로 갈리면 켠다. 안 갈리면 켜지 말 것 —
    #   진짜 교차점을 버리는 쪽이 가짜를 결속하는 것보다 나쁘다.
    layer_mode: 'off'            # 'off' | 'on'
    layer_gap_mm: 75.0           # 이 값 이상 벌어지면 층 혼합 → 제외
    layer_on_unknown: 'accept'   # 갈래 부족으로 판정불가일 때: accept | reject

    # 검출 재시도 (멀티검출 내 서비스 실패 시)
    detection_retry_count: 3     # 검출 실패 시 재시도 횟수
    detection_retry_delay: 1.0   # 재시도 대기 시간 (초)
