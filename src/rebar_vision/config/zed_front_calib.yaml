# 전방 ZED X (S/N 43764735) 보정 덮어쓰기
#
# 이 카메라는 좌우 리그가 하우징 안에서 pitch 1.25° 틀어져 있어 공장
# 보정값으로는 depth 가 깨진다. 아래 파일이 그걸 되돌린다.
# 넘기지 않으면 조용히 깨진 공장값으로 되돌아가니 **반드시 함께 띄울 것**.
#
# 근거와 측정값: data/calibration/zedx/README.md
#
#   ros2 launch ... --ros-args --params-file <이 파일>
#
# 후방(43615762)에는 쓰지 말 것 — 그쪽은 공장값이 정상이다.
/**:
  ros__parameters:
    general:
      optional_opencv_calibration_file: '/home/koceti/ros2_ws/src/rebar_control/data/calibration/zedx/zed_calibration_43764735.yml'
