# 카메라 외부 파라미터 설정 (비전 기반 철근 교차점 검출)
# 위치: mm (로봇 기준), 회전: degrees [pitch, roll, yaw]
#
# ⚠️ [2026-08-06] zedxmini1/2를 좌/우 측면 → 전방/후방으로 물리 이동
#    (zedxmini2=전방, zedxmini1=후방). 아래 left_camera/right_camera 외부파라미터는
#    이전 좌/우 장착 기준이라 현재 물리 배치와 맞지 않는다 (= 캘리브 무효).
#    현재 rebar_detection_node는 full_system.launch.py에서 비활성(orbbec 검출로 전환)이라
#    실사용 영향은 없음. 결속용 zedxmini 복귀 시 재캘리브 필수.

rebar_detection_node:
  ros__parameters:
    # YOLO 모델
    model_path: '/home/koceti/ros2_ws/src/rebar_vision/model/best.pt'
    confidence_threshold: 0.5
    depth_kernel_size: 5
    max_depth_m: 2.0
    min_depth_m: 0.05

    # 좌표변환 모델: nodepth(2D회귀) / linear / gbr / 3d(강체변환)
    # 3d = depth 최근접표면 복원 + Hand-Eye 강체변환
    #   (right만 캘리브됨, left는 미보정 → 기존 기하 fallback)
    calibration_model: '3d'

    # 그리드 설정
    grid_rows: 2
    grid_cols: 3
    dedup_distance_mm: 20.0

    # 좌측 카메라 (zedxmini1, SN: 56755054)
    left_camera:
      position: [-200.0, 100.0, 108.0]
      rotation: [40.0, 0.0, 0.0]   # pitch, roll, yaw (Y축 정렬)

    # 우측 카메라 (zedxmini2, SN: 54946194)
    # 원점: 스테이지 홈(Xmin,Ymin) 작업공구 끝단 기준
    right_camera:
      position: [150.0, 370.0, -40.0]   # X=+15cm(앞), Y=+37cm(왼쪽), Z=-4cm(아래)
      rotation: [40.0, 0.0, 0.0]   # pitch, roll, yaw (Y축 정렬)
