# 주행용 zedxmini(전/후방) 부하 감축 override
#
# ⚠ 왜 이 파일이 필요한가 (2026-08-06):
#   full_system.launch.py에서 `grab_resolution`/`grab_frame_rate`/`depth_mode` 등을
#   zed_camera.launch.py에 인자로 넘기고 있었으나, **그 launch는 해당 인자를 받지 않는다**
#   (받는 인자: camera_name/camera_model/serial_number/publish_tf/ros_params_override_path 등).
#   launch는 모르는 인자를 조용히 무시하므로 설정이 적용된 적이 없었고, 실제로는
#   기종 기본값 zedxm.yaml의 **HD1200 @ 30Hz**로 돌고 있었다(실행 파라미터로 확인).
#   → 개별 인자 대신 이 override yaml 경로를 `ros_params_override_path`로 넘긴다.
#
# 부하 근거: 1920x1200@30 = 69.1 Mpx/s → 1280x720@15 = 13.8 Mpx/s (약 1/5)
#   CPU가 병목이었다(load average 14.7/12코어, component_container 80%대 다수).
# 판정 영향 없음: deck_edge는 512로 다운스케일해 추론하고, seg 주기는 4Hz라
#   15Hz 발행으로도 3.75배 여유.
/**:
    ros__parameters:
        general:
            # ⚠ [2026-09-08] ZED X 교체 후 **HD720 → SVGA**.
            #   ZED X/ZED X Mini 지원 해상도는 HD1200/HD1080/SVGA 뿐이고 HD720은 없다.
            #   미지원 값이면 open 실패 → 재시도가 GMSL을 교란해 **옆 카메라까지**
            #   죽는다([[zedxone_coexistence]]). SVGA=960x600으로, deck_edge가
            #   지금까지 보던 해상도와 같다.
            grab_resolution: 'SVGA'       # 기종 기본 HD1200 → 다운
            # ⚠ 15는 GMSL 지원 모드 중 **최저**다. 더 낮추지 말 것 —
            #   미지원 fps는 open 실패 → 반복 재시도가 GMSL 버스를 교란해
            #   옆 카메라까지 CAMERA NOT DETECTED로 죽인다([[zedxone_coexistence]] 사례).
            #   또한 read-only 파라미터라 런타임 변경 불가(카메라 재기동 필요).
            grab_frame_rate: 15           # 기종 기본 30 → 다운
            # ★ [2026-09-08] 발행 해상도를 grab과 동일하게 둔다.
            #   기본값이 pub_resolution:CUSTOM + pub_downscale_factor:2.0 이라
            #   SVGA(960x600)가 **480x300**으로 반토막 발행됐다. 이전 카메라 때는
            #   grab이 HD1200이라 /2 해도 960x600이었고, deck_edge 임계·레벨봉
            #   원근 폭 모델이 전부 그 해상도 기준으로 잡혀 있다.
            #   480x300은 seg 입력(512 다운스케일)보다도 작아 손해다.
            pub_resolution: 'NATIVE'      # = grab_resolution (960x600)
            # ⚠ **발행률은 seg 주기(4Hz)에 맞춘다.** grab은 15로 둬 노출/AE는 안정적으로
            #   가져가되, DDS로 내보내는 프레임만 줄인다. 15Hz 발행은 3.75배 과잉이었고
            #   그만큼이 직렬화·전송·구독자 콜백 비용으로 나갔다(주행 카메라 2대분).
            #   staleness 워치독(1s)에는 6Hz면 6프레임 여유 → 안전.
            pub_frame_rate: 6.0
        depth:
            depth_mode: 'NONE'            # 주행 판정은 RGB seg만 사용
            point_cloud_freq: 1.0         # depth NONE이면 무의미하나 안전하게 최소화
        pos_tracking:
            pos_tracking_enabled: false   # VSLAM 미사용(엔코더 odometry로 제어)
        object_detection:
            od_enabled: false
        body_tracking:
            bt_enabled: false
