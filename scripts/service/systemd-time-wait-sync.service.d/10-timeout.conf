# systemd-time-wait-sync 의 **무한 대기를 끊는다.**
#
# 기본값 TimeoutStartSec=infinity 라, 네트워크(LTE/WiFi)가 없으면 NTP 동기가 영영
# 안 끝나고 → 그 뒤에 뜨게 한 robot-control 도 **영영 안 뜬다.** 현장은 LTE 운용이라
# 음영 지역에서 부팅하면 로봇이 먹통이 된다.
#
# 60초면 정상 환경에선 충분하다(2026-09-22 실측: 부팅 후 약 30초에 첫 동기).
# 시간이 넘으면 이 유닛이 실패로 끝나고, robot-control 은 Wants= 이므로 그대로 기동한다.
# ⚠ 그 경우엔 나중에 네트워크가 붙는 순간 시계가 옮겨질 수 있다 — 즉 **이 설정은
#   흔한 경우를 막는 것이지 모든 경우를 막지는 못한다.**
[Service]
TimeoutStartSec=60
