# robot-control 이 **NTP 시계 동기가 끝난 뒤에** 뜨게 한다.
#
# 왜 (반복 사고):
#   부팅 직후 젯슨 시계는 틀려 있고(RTC 백업전원 없음 → **1분만 꺼져도 1970**),
#   조금 뒤 NTP 가 시계를 **한 번에 옮긴다**(step). 그 순간 이미 떠 있던 Python
#   노드들의 DDS 통신이 깨진다 — 노드는 살아 있는데 서로 데이터를 못 주고받는다.
#   현장에선 "리모콘이 안 먹는다"로 나타난다.
#
#     2026-09-16  런치 도중 시계 +13h 점프 → Python 노드 전멸
#     2026-09-22  11:33:55 서비스 기동 → 11:34:08 NTP 첫 동기(−0.686s)
#                 → 11:34:23 리모콘 두절. 두 번 다 **시계가 옮겨진 1초 안에** 끊겼다.
#
# ★ 2026-09-22 저녁 개정: time-sync.target 대기 → **chronyc waitsync** 로 교체.
#   systemd-time-wait-sync 는 timesyncd 용이라 chrony 가 동기를 끝내도 못 알아챈다.
#   실측(17:30 부팅): chrony 는 27.9s 에 시계를 맞췄는데 time-wait-sync 는 60s
#   제한까지 꽉 기다리다 "Failed"로 끝났고, 서비스는 69s 에야 떴다.
#   waitsync 는 chrony 에게 직접 묻는다 → 맞춰지는 즉시 기동.
#
#   waitsync 30 0 0 5 = 5초마다 최대 30번(150초) 확인. 동기되면 바로 통과.
#     LTE 가 150초 안에 안 붙으면 포기하고 그냥 기동한다('-' 접두어 = 실패 무시).
#     그때 나중에 LTE 가 붙으면 시계가 크게 점프 → 리모콘 먹통 가능 →
#     `sudo systemctl restart robot-control`.
#   ★ 네트워크(기본 경로)가 20초 안에 안 생기면 **기다리지 않는다.** (20초 = 부팅 직후
#     와이파이/LTE 가 아직 안 붙어서 '없음'으로 오판하는 것 방지.) 현장 투입 중엔 인터넷 없이
#     리모콘만 쓰므로, 매번 150초씩 늦게 뜨면 안 된다. 인터넷이 끝까지 없으면 chrony 가
#     시계를 안 건드리니 먹통 위험도 없다. (위험한 건 **켜진 채로 인터넷이 새로 붙는** 경우뿐)
#   '+' = root 로 실행(User=koceti 와 무관하게 chrony 에 질의).
#   TimeoutStartSec: 기본 90초면 대기 150초 + zed 데몬 재시작 도중 기동실패로 판정된다.
#
# 설치:
#   sudo cp scripts/service/robot-control.service.d/10-wait-time-sync.conf \
#           /etc/systemd/system/robot-control.service.d/
#   sudo systemctl disable systemd-time-wait-sync     # chrony 에선 쓸모없고 60초만 잡아먹는다
#   sudo systemctl daemon-reload
#   확인: systemctl show robot-control -p TimeoutStartUSec -p ExecStartPre
[Unit]
After=chrony.service
Wants=chrony.service

[Service]
TimeoutStartSec=240
ExecStartPre=+-/bin/sh -c 'for i in $(seq 20); do ip route show default | grep -q . && break; sleep 1; done; if ip route show default | grep -q .; then /usr/bin/chronyc waitsync 30 0 0 5; else echo "네트워크 없음(20초) → 시계 동기 대기 생략"; fi'
