# /etc/chrony/conf.d/10-robot-no-step.conf
#
# ★ 2026-09-22 작은 오차는 점프 없이 천천히, 10분 넘는 오차만 점프 (아래 ★★ 참고).
#
# 왜: 노드가 도는 중에 시계가 한 번에 옮겨지면 Python 노드 DDS 통신이 죽는다
#     (리모콘 먹통으로 발현). 9/16 +13시간, 9/22 11:34:08 -0.686초 두 번 다
#     NTP 첫 동기 순간과 일치. systemd-timesyncd는 0.4초만 넘어도 점프시키고
#     끌 수 없다 → chrony로 교체.
#     현장은 LTE가 부팅 후 언제 붙을지 모른다(수동조작 중에 붙을 수도 있다) →
#     "부팅 때 동기 기다리기"만으로는 못 막는다. 작은 보정은 점프 없이 한다.
#
# 동작:
#   - 기본 `makestep 1 3`(1초만 넘어도 점프)은 끄고 이 파일의 `makestep 600 -1`만 쓴다.
#     ⚠ /etc/chrony/chrony.conf 의 기본 줄은 **주석 처리해야** 한다(설치 명령 참고).
#   - maxslewrate 1000ppm = 초당 1ms. 0.7초 오차 ≈ 12분에 맞춰진다.
#     기본값(83333ppm = 초당 83ms)은 시계가 8% 빨리/늦게 가 타이머에 부담.
#
# 수동으로 한 번에 맞추려면 (robot-control 멈춘 상태에서):
#       sudo systemctl stop robot-control
#       sudo chronyc makestep
#       sudo systemctl start robot-control
#   확인: `chronyc tracking` 의 System time 줄(남은 오차), `timedatectl` 의 RTC time.
#
# 설치 (한 줄씩):
#   sudo apt install -y chrony                       # systemd-timesyncd는 자동으로 제거됨
#   sudo sed -i 's/^makestep/#makestep/' /etc/chrony/chrony.conf
#   sudo cp scripts/service/chrony/10-robot-no-step.conf /etc/chrony/conf.d/
#   sudo systemctl restart chrony
#   chronyc tracking && grep -n makestep /etc/chrony/chrony.conf

# ★★ 2026-09-22 저녁 수정: "절대 점프 금지"는 **틀린 설계였다.**
#   13:07 전원 끊김 → 15:23 재부팅까지 2시간 넘게 꺼져 있자 RTC(백업 배터리 없음)가
#   초기화돼 시계가 **1970-01-01**로 떴다. 점프 금지라 56년을 영원히 못 따라잡았고,
#   Tailscale TLS 인증서 검증이 실패("current time 1970 is before 2026-08-03")해
#   원격접속 불가 → "부팅 안 됨"처럼 보였다.
#   게다가 예전 systemd-timesyncd는 부팅 때 **마지막으로 알던 시각**
#   (/var/lib/systemd/timesync/clock 수정시각)으로 시계를 당겨 줬는데, chrony로 바꾸며
#   그 보호막도 사라졌다(그래서 예전엔 1970까지는 안 갔다).
#
# → **작은 오차는 천천히, 큰 오차(10분 초과)는 점프**로 바꾼다.
#     makestep 600 -1  : 오차가 600초를 넘으면 언제든(-1 = 횟수 제한 없음) 한 번에 맞춘다.
#   오늘 리모콘을 죽인 0.7초 같은 작은 보정은 여전히 점프 없이 처리된다.
#   ⚠ 큰 점프가 노드 동작 중에 일어나면 여전히 DDS가 죽을 수 있다 → 그때는
#     robot-control 재시작. 근본 대책은 **RTC 백업 배터리**(젯슨 캐리어보드 코인셀).
makestep 600 -1
maxslewrate 1000
rtcsync
