# 카메라 좌표(mm) → **그 자세에서 보낼 스테이지 위치(mm)**
#   stage_mm = A @ P_cam + b      (A 3x3, b 3)
# ⚠⚠ [2026-10-07 재적합] **깊이를 X·Y 에서 뺐고 Z 는 상수다.**
#   근거(1번 자세 3점 실측): 깊이 401→X오차 -12.5 / 444→-14.4 / 534→-30.8 로
#   **X 오차가 깊이에 비례**(기울기 -0.144mm/mm)했고 Y 오차는 ±2mm 로 깊이와
#   무관했다. 옛 A 의 X행 깊이계수 +0.0933 / Y행 -0.0009 가 그 차이를 설명한다 —
#   **Y 는 이미 깊이를 안 써서 정확했다.** 교차점이 거의 한 평면이라 깊이가
#   cx·cy 의 선형함수고, 깊이 열이 중복되어 최소제곱이 아무 값이나 골랐다.
#   → A 의 3열(깊이)을 X·Y 행에서 0 으로 두고, Z 는 데크플레이트 평면이므로
#     자세별 상수(b[2])로 둔다 (사용자 결정).
# ⚠ **이 모델은 "그 평면" 전용이다.** 평면이 바뀌면(데크플레이트 유무, 배근 높이)
#   같은 cx·cy 가 다른 물리점이 되므로 **다시 받아야 한다.** 그래서 10-04 의 26짝은
#   여기 쓰지 않았다 — 그 짝들은 pairs.json 에 그대로 남아 있다.
# ⚠ 1번 자세는 **3점 정확적합**이라 데이터만으로는 검증이 안 된다. 검증은 장비에서
#   네 번째 교차점으로 보내 오차를 재는 것으로 했다.
# ⚠ 자세 2·3·4 는 1번 + **옛 오프셋**이다 (건 끝 기하는 데크플레이트와 무관).
#   각 자세에서 실측으로 확인·갱신할 것.
# ⚠⚠ [2026-10-07 사용자 결정] **Z 는 자세와 무관하게 -58.0mm 고정이다.**
#   데크플레이트 위 철근은 **평면**으로 봐도 되므로 결속 깊이가 어디서나 같다.
#   실측이 이를 지지한다 — 1번 -58.80 · 2번 -56.64 · 3번은 -57.35 에서 충돌 없이
#   들어갔다. 자세별로 나누면 측정 오차만 모델에 섞인다.
#   ⚠ 데크플레이트를 치우거나 배근 높이가 바뀌면 **이 값부터 다시 잡아야 한다.**
