note_336l: '2026-11-09 교차점 카메라 Gemini 2L → 336L 교체. 2L 의 A 를 물려받되 **깊이 열 A[:,2] 만
  공통 보정**(Δ=(-0.00316,+0.05013,+0.01809) = 깊이 100mm 당 (-0.3,+5.0,+1.8)mm)하고 b 는 자세별로
  재적합했다. 짝 12개(자세당 3). LOO: b만 6.95mm → b+깊이열 5.59mm (참고: 2L 은 22짝으로 4.89mm). 장비를
  옮긴 뒤 out-of-sample 검증: 깊이 476~479mm 에서 3.4/3.6/3.7mm, 깊이 365~371mm 에서 9.6/9.7mm(그때는
  그 깊이 짝이 없었다 — 지금은 들어있다).'
